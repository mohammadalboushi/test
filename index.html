<!DOCTYPE html><html lang='ar' dir='rtl'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Premium Calculator</title><style>*{margin:0;padding:0;box-sizing:border-box}body{height:100vh;display:flex;justify-content:center;align-items:center;font-family:sans-serif;background:linear-gradient(-45deg,#0f172a,#1e293b,#312e81,#0f172a);background-size:400% 400%;animation:bg 12s ease infinite;transition:.3s}.light{background:#f3f4f6!important}.calc{width:360px;padding:20px;border-radius:30px;background:rgba(255,255,255,.08);backdrop-filter:blur(20px);box-shadow:0 8px 40px rgba(0,0,0,.4)}.light .calc{background:rgba(255,255,255,.9)}#history{height:25px;color:#aaa;text-align:left;overflow:hidden}#screen{width:100%;height:80px;background:none;border:none;color:#fff;font-size:42px;text-align:left;outline:none}.light #screen{color:#111}.top{display:flex;justify-content:flex-end;margin-bottom:10px}.theme{height:40px;padding:0 12px;border:none;border-radius:12px;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}button{height:65px;border:none;border-radius:18px;font-size:22px;color:white;background:rgba(255,255,255,.1);backdrop-filter:blur(5px);cursor:pointer;transition:.15s}button:active{transform:scale(.92)}.op{background:rgba(99,102,241,.6)}.eq{background:rgba(16,185,129,.8)}.clr{background:rgba(239,68,68,.8)}@keyframes bg{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}</style></head><body><div class='calc'><div class='top'><button class='theme' onclick='toggleTheme()'>🌙/☀️</button></div><div id='history'></div><input id='screen' readonly><div class='grid'><button class='clr' onclick='clearAll()'>C</button><button onclick='add(`(`)'>(</button><button onclick='add(`)`)'>)</button><button class='op' onclick='add(`/`)'>÷</button><button onclick='add(`7`)'>7</button><button onclick='add(`8`)'>8</button><button onclick='add(`9`)'>9</button><button class='op' onclick='add(`*`)'>×</button><button onclick='add(`4`)'>4</button><button onclick='add(`5`)'>5</button><button onclick='add(`6`)'>6</button><button class='op' onclick='add(`-`)'>−</button><button onclick='add(`1`)'>1</button><button onclick='add(`2`)'>2</button><button onclick='add(`3`)'>3</button><button class='op' onclick='add(`+`)'>+</button><button onclick='add(`0`)'>0</button><button onclick='add(`.`)'>.</button><button onclick='backspace()'>⌫</button><button class='eq' onclick='calculate()'>=</button></div></div><script>const s=document.getElementById('screen'),h=document.getElementById('history');function add(v){s.value+=v}function clearAll(){s.value='';h.textContent=''}function backspace(){s.value=s.value.slice(0,-1)}function calculate(){try{h.textContent=s.value;s.value=Function('return '+s.value)()}catch{s.value='Error'}}function toggleTheme(){document.body.classList.toggle('light');localStorage.theme=document.body.classList.contains('light')?'light':'dark'}if(localStorage.theme==='light')document.body.classList.add('light');document.addEventListener('keydown',e=>{if('0123456789+-*/().'.includes(e.key))add(e.key);if(e.key==='Enter')calculate();if(e.key==='Backspace')backspace();if(e.key==='Escape')clearAll();});</script></body></html>
