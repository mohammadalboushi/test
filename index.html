<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#4776E6">
    <meta name="description" content="ستوديو الكاريوكي الاحترافي لعزل الموسيقى والصوت بواجهة أنيقة وسهلة الاستخدام" />
    <title>ستوديو الكاريوكي الاحترافي</title>

    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary: #4776E6;
            --secondary: #8E54E9;
            --text-main: #333;
            --text-muted: #6c757d;
            --card: rgba(255, 255, 255, 0.95);
            --border: rgba(0, 0, 0, 0.08);
            --drop: rgba(71, 118, 230, 0.16);
        }

        * {
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }

        html, body {
            margin: 0;
            padding: 0;
            min-height: 100%;
        }

        body {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: var(--text-main);
        }

        .app-container {
            width: 100%;
            max-width: 430px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            padding: 28px 20px 22px;
            text-align: center;
            backdrop-filter: blur(10px);
        }

        .app-header i {
            font-size: 3rem;
            color: var(--secondary);
            margin-bottom: 10px;
        }

        h2 {
            margin: 0 0 18px;
            font-size: 1.5rem;
            font-weight: 700;
        }

        .file-upload-wrapper {
            position: relative;
            margin-bottom: 16px;
            border-radius: 18px;
            transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
        }

        .file-upload-wrapper.dragover .custom-file-upload {
            background: var(--drop);
            border-color: var(--primary);
            transform: translateY(-1px);
            box-shadow: 0 10px 25px rgba(71, 118, 230, 0.12);
        }

        .file-upload-wrapper input[type="file"] {
            position: absolute;
            inset: 0;
            opacity: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }

        .custom-file-upload {
            background: #e9ecef;
            border: 2px dashed #adb5bd;
            border-radius: 16px;
            padding: 22px 18px;
            color: #495057;
            font-weight: 600;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            transition: all 0.3s ease;
            min-height: 112px;
            justify-content: center;
        }

        .custom-file-upload i {
            font-size: 2rem;
            color: var(--primary);
        }

        .file-upload-wrapper:hover .custom-file-upload {
            background: #e2e6ea;
            border-color: var(--primary);
        }

        .btn-process, .btn-download, .btn-secondary {
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s, background 0.2s, opacity 0.2s;
        }

        .btn-process {
            background: linear-gradient(to right, var(--primary), var(--secondary));
            color: #fff;
            padding: 14px 24px;
            font-size: 1.1rem;
            font-weight: 700;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            box-shadow: 0 8px 20px rgba(71, 118, 230, 0.35);
        }

        .btn-process:active,
        .btn-download:active,
        .btn-secondary:active {
            transform: scale(0.96);
        }

        .btn-process:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            margin-top: 10px;
            width: 100%;
            padding: 12px 16px;
            border: 1px solid rgba(0,0,0,0.08);
            background: #fff;
            color: var(--text-main);
            font-weight: 700;
        }

        .btn-secondary:hover {
            background: #f8f9fa;
        }

        #statusMessage {
            margin-top: 16px;
            font-weight: 600;
            font-size: 0.95rem;
            min-height: 24px;
        }

        .progress-wrap {
            margin-top: 14px;
            display: none;
            gap: 8px;
            text-align: right;
        }

        .progress-bar {
            width: 100%;
            height: 12px;
            border-radius: 999px;
            background: rgba(0,0,0,0.08);
            overflow: hidden;
        }

        .progress-bar > span {
            display: block;
            height: 100%;
            width: 0%;
            border-radius: inherit;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            transition: width 0.25s ease;
        }

        .progress-text {
            font-size: 0.9rem;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }

        .result-box {
            margin-top: 24px;
            display: none;
            flex-direction: column;
            gap: 16px;
            animation: fadeIn 0.35s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .audio-card {
            background: #fff;
            border-radius: 16px;
            padding: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border: 1px solid #eaeaea;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .audio-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 22px rgba(0,0,0,0.08);
        }

        .audio-card h3 {
            margin: 0 0 12px;
            font-size: 1.05rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .audio-card h3 i {
            color: var(--secondary);
        }

        audio {
            width: 100%;
            height: 40px;
            margin-bottom: 12px;
            outline: none;
        }

        .btn-download {
            background: #28a745;
            color: white;
            padding: 10px 15px;
            font-size: 1rem;
            font-weight: 600;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .btn-download:hover {
            background: #218838;
        }

        .fa-spin {
            animation: fa-spin 1.2s infinite linear;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="app-header">
            <i class="fa-solid fa-headphones-simple"></i>
            <h2>عزل الكاريوكي الاحترافي</h2>
        </div>

        <div class="file-upload-wrapper" id="dropZone">
            <input type="file" id="audioFile" accept="audio/*" onchange="updateFileName(this)">
            <div class="custom-file-upload">
                <i class="fa-solid fa-cloud-arrow-up"></i>
                <span id="fileNameDisplay">اختر الأغنية أو اسحبها هنا</span>
            </div>
        </div>

        <button class="btn-process" id="processBtn" onclick="processAudio()">
            <i class="fa-solid fa-wand-magic-sparkles"></i>
            ابدأ العزل الآن
        </button>

        <button class="btn-secondary" id="resetBtn" onclick="resetApp()">ملف جديد</button>

        <div class="progress-wrap" id="progressWrap">
            <div class="progress-text">
                <span id="progressLabel">جاري التحضير...</span>
                <span id="progressPercent">0%</span>
            </div>
            <div class="progress-bar"><span id="progressFill"></span></div>
        </div>

        <div id="statusMessage"></div>

        <div class="result-box" id="resultContainer">
            <div class="audio-card">
                <h3><i class="fa-solid fa-music"></i> الموسيقى مع الكورال</h3>
                <audio id="instrumentalChoirAudio" controls></audio>
                <button class="btn-download" onclick="downloadFile('instrumentalChoirAudio', 'Instrumental_Choir.wav')">
                    <i class="fa-solid fa-download"></i> تنزيل المقطع
                </button>
            </div>

            <div class="audio-card">
                <h3><i class="fa-solid fa-microphone-lines"></i> صوت المطرب فقط</h3>
                <audio id="vocalAudio" controls></audio>
                <button class="btn-download" onclick="downloadFile('vocalAudio', 'Vocals_Only.wav')">
                    <i class="fa-solid fa-download"></i> تنزيل المقطع
                </button>
            </div>
        </div>
    </div>

    <script type="module">
        import { Client } from "https://esm.sh/@gradio/client";

        let progressTimer = null;
        let selectedFile = null;

        const fileInput = document.getElementById('audioFile');
        const dropZone = document.getElementById('dropZone');
        const display = document.getElementById('fileNameDisplay');
        const statusMessage = document.getElementById('statusMessage');
        const resultContainer = document.getElementById('resultContainer');
        const processBtn = document.getElementById('processBtn');
        const progressWrap = document.getElementById('progressWrap');
        const progressFill = document.getElementById('progressFill');
        const progressLabel = document.getElementById('progressLabel');
        const progressPercent = document.getElementById('progressPercent');

        function setProgress(percent, label) {
            progressWrap.style.display = 'grid';
            progressFill.style.width = Math.max(0, Math.min(100, percent)) + '%';
            progressLabel.textContent = label;
            progressPercent.textContent = Math.max(0, Math.min(100, percent)) + '%';
        }

        function startFakeProgress() {
            let p = 0;
            setProgress(0, 'جاري رفع الملف...');
            progressTimer = setInterval(() => {
                p = Math.min(92, p + Math.max(2, Math.round(Math.random() * 9)));
                if (p < 35) setProgress(p, 'جاري رفع الملف...');
                else if (p < 70) setProgress(p, 'السيرفر يعالج الصوت...');
                else setProgress(p, 'تقريباً انتهينا...');
            }, 900);
        }

        function stopFakeProgress(done = false) {
            if (progressTimer) clearInterval(progressTimer);
            progressTimer = null;
            if (done) setProgress(100, 'تمت المعالجة بنجاح');
            else progressWrap.style.display = 'none';
        }

        function setSelectedFile(file) {
            selectedFile = file;
            if (file) {
                display.textContent = file.name;
                display.style.color = '#4776E6';
            } else {
                display.textContent = 'اختر الأغنية أو اسحبها هنا';
                display.style.color = '#495057';
            }
        }

        window.updateFileName = function(input) {
            if (input.files && input.files.length > 0) {
                setSelectedFile(input.files[0]);
            } else {
                setSelectedFile(null);
            }
        }

        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('dragover');
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            const files = e.dataTransfer.files;
            if (files && files.length > 0) {
                fileInput.files = files;
                setSelectedFile(files[0]);
            }
        });

        window.resetApp = function() {
            fileInput.value = '';
            fileInput.disabled = false;
            setSelectedFile(null);
            statusMessage.textContent = '';
            resultContainer.style.display = 'none';
            progressWrap.style.display = 'none';
            processBtn.disabled = false;
            processBtn.innerHTML = '<i class="fa-solid fa-wand-magic-sparkles"></i> ابدأ العزل الآن';
        }

        window.processAudio = async function() {
            if (fileInput.files.length === 0) {
                statusMessage.textContent = 'يرجى اختيار الأغنية أولاً يا غالي!';
                statusMessage.style.color = '#dc3545';
                return;
            }

            const audioFile = fileInput.files[0];
            const instrumentalChoirAudio = document.getElementById('instrumentalChoirAudio');
            const vocalAudio = document.getElementById('vocalAudio');

            processBtn.disabled = true;
            fileInput.disabled = true;
            processBtn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> جاري المعالجة السحرية...';
            statusMessage.textContent = 'الرجاء الانتظار، السيرفر يقوم بتحليل المقامات الصوتية...';
            statusMessage.style.color = '#4776E6';
            resultContainer.style.display = 'none';
            startFakeProgress();

            try {
                const client = await Client.connect('TheStinger/UVR5_UI');
                const result = await client.predict('/vrarch_separator', {
                    audio: audioFile,
                    model: '6_HP-Karaoke-UVR.pth',
                    out_format: 'wav',
                    window_size: 320,
                    aggression: 1,
                    tta: true,
                    post_process: true,
                    post_process_threshold: 0.1,
                    high_end_process: true,
                    batch_size: 1,
                    norm_thresh: 0.1,
                    amp_thresh: 0.1,
                    single_stem: '(None)'
                });

                if (!result.data || result.data.length === 0) {
                    throw new Error('لا توجد استجابة من السيرفر.');
                }

                const getAudioUrl = (item) => {
                    if (typeof item === 'string') return item;
                    if (item && item.url) return item.url;
                    if (item && item.path) return 'https://thestinger-uvr5-ui.hf.space/file=' + item.path;
                    return '';
                };

                instrumentalChoirAudio.src = getAudioUrl(result.data[0]);
                vocalAudio.src = getAudioUrl(result.data[1]);

                stopFakeProgress(true);
                statusMessage.textContent = '✅ انتهت المعالجة بنجاح. يمكنك الآن الاستماع أو تنزيل الملفات.';
                statusMessage.style.color = '#28a745';
                resultContainer.style.display = 'flex';
            } catch (error) {
                console.error(error);
                stopFakeProgress(false);
                statusMessage.textContent = 'رسالة السيرفر: ' + (error.message || error);
                statusMessage.style.color = '#dc3545';
            } finally {
                processBtn.disabled = false;
                fileInput.disabled = false;
                processBtn.innerHTML = '<i class="fa-solid fa-wand-magic-sparkles"></i> ابدأ العزل الآن';
            }
        }

        window.downloadFile = async function(audioElementId, defaultFilename) {
            const audioElement = document.getElementById(audioElementId);
            const url = audioElement.src;
            if (!url) return;

            try {
                const response = await fetch(url);
                const blob = await response.blob();
                const blobUrl = window.URL.createObjectURL(blob);

                const link = document.createElement('a');
                link.href = blobUrl;
                link.download = defaultFilename;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                window.URL.revokeObjectURL(blobUrl);
            } catch (error) {
                console.error('خطأ في التحميل المباشر:', error);
                window.open(url, '_blank');
            }
        }
    </script>
</body>
</html>
