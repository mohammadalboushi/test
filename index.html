<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>آلة حاسبة</title><style>body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#1e293b,#0f172a);display:flex;justify-content:center;align-items:center;height:100vh}.calc{background:#111827;padding:20px;border-radius:20px;box-shadow:0 0 30px rgba(0,0,0,.4);width:320px}.screen{width:100%;height:70px;border:none;border-radius:12px;background:#1f2937;color:#fff;font-size:32px;text-align:left;padding:10px;box-sizing:border-box;margin-bottom:15px}.buttons{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}button{height:60px;border:none;border-radius:12px;font-size:22px;cursor:pointer;background:#374151;color:#fff}button:hover{opacity:.85}.op{background:#f59e0b}.eq{background:#10b981}.clr{background:#ef4444}</style></head><body><div class="calc"><input class="screen" id="screen" readonly><div class="buttons"><button class="clr" onclick="clr()">C</button><button onclick="add('/')">÷</button><button onclick="add('*')">×</button><button onclick="add('-')">-</button><button onclick="add('7')">7</button><button onclick="add('8')">8</button><button onclick="add('9')">9</button><button class="op" onclick="add('+')">+</button><button onclick="add('4')">4</button><button onclick="add('5')">5</button><button onclick="add('6')">6</button><button onclick="add('.')">.</button><button onclick="add('1')">1</button><button onclick="add('2')">2</button><button onclick="add('3')">3</button><button class="eq" onclick="calc()">=</button><button style="grid-column:span 4" onclick="add('0')">0</button></div></div><script>function add(v){screen.value+=v}function clr(){screen.value=''}function calc(){try{screen.value=eval(screen.value)}catch{screen.value='خطأ'}}</script></body></html>
