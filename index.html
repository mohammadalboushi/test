<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#090A12">
<meta name="description" content="Radox AI Studio - منصة محادثة ذكاء اصطناعي احترافية">
<title>Radox AI Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #090A12;
  --card: #121422;
  --secondary: #191C2D;
  --purple: #9B7BFF;
  --blue: #56C8FF;
  --success: #54E0A2;
  --danger: #FF6B7A;
  --warning: #FFC857;
  --text: #F4F5FF;
  --text-sec: #A2A7C2;
  --border: rgba(155, 123, 255, 0.14);
  --border-soft: rgba(255, 255, 255, 0.06);
  --radius: 14px;
  --radius-sm: 10px;
  --font: 'Tajawal', system-ui, -apple-system, 'Segoe UI', Tahoma, sans-serif;
  --mono: 'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace;
  --shadow-glow: 0 0 24px rgba(155, 123, 255, 0.18);
  --shadow-soft: 0 8px 30px rgba(0, 0, 0, 0.4);
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  font-size: 15px;
  line-height: 1.65;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  overscroll-behavior: none;
  position: relative;
}

body::before, body::after {
  content: '';
  position: fixed;
  pointer-events: none;
  z-index: 0;
  border-radius: 50%;
  filter: blur(60px);
}
body::before {
  top: -180px; right: -180px;
  width: 520px; height: 520px;
  background: radial-gradient(circle, rgba(155,123,255,0.22), transparent 70%);
}
body::after {
  bottom: -200px; left: -200px;
  width: 480px; height: 480px;
  background: radial-gradient(circle, rgba(86,200,255,0.16), transparent 70%);
}

button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
input, textarea, select { font-family: inherit; color: inherit; }
a { color: var(--blue); text-decoration: none; }
a:hover { text-decoration: underline; }
svg { display: block; }

/* ============ APP LAYOUT ============ */
.app {
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  height: 100dvh;
  height: 100vh;
  overflow: hidden;
}
@supports (height: 100dvh) { .app { height: 100dvh; } }

/* ============ HEADER ============ */
.header {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 12px;
  background: rgba(18, 20, 34, 0.85);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--border-soft);
  flex-shrink: 0;
  padding-top: calc(10px + env(safe-area-inset-top, 0px));
}
.icon-btn {
  width: 38px; height: 38px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 10px;
  color: var(--text-sec);
  transition: background 0.15s, color 0.15s, transform 0.1s;
  flex-shrink: 0;
}
.icon-btn:hover { background: var(--secondary); color: var(--text); }
.icon-btn:active { transform: scale(0.94); }
.icon-btn svg { width: 20px; height: 20px; }
.icon-btn:disabled { opacity: 0.4; cursor: not-allowed; }
.icon-btn.spinning svg { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.logo {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
  margin-inline-end: 4px;
}
.logo-mark {
  width: 32px; height: 32px;
  border-radius: 9px;
  background: linear-gradient(135deg, var(--purple), var(--blue));
  display: flex; align-items: center; justify-content: center;
  font-weight: 800;
  color: #fff;
  font-size: 17px;
  box-shadow: 0 0 18px rgba(155, 123, 255, 0.45);
  flex-shrink: 0;
}
.logo-text {
  font-weight: 800;
  font-size: 15px;
  letter-spacing: 0.2px;
  display: none;
}
.logo-accent { color: var(--purple); }
@media (min-width: 420px) { .logo-text { display: inline; } }

.header-center {
  flex: 1;
  display: flex;
  align-items: center;
  gap: 6px;
  min-width: 0;
  justify-content: center;
}
.model-select {
  flex: 1;
  min-width: 0;
  max-width: 260px;
  background: var(--secondary);
  border: 1px solid var(--border-soft);
  border-radius: 10px;
  padding: 8px 10px;
  font-size: 13px;
  color: var(--text);
  outline: none;
  transition: border-color 0.15s, box-shadow 0.15s;
  text-overflow: ellipsis;
  appearance: none;
  -webkit-appearance: none;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='10' viewBox='0 0 24 24' fill='none' stroke='%23A2A7C2' stroke-width='3'><polyline points='6 9 12 15 18 9'/></svg>");
  background-repeat: no-repeat;
  background-position: left 10px center;
  padding-left: 26px;
  cursor: pointer;
}
.model-select:focus { border-color: var(--purple); box-shadow: 0 0 0 3px rgba(155,123,255,0.15); }
.model-select:disabled { opacity: 0.5; cursor: not-allowed; }
.model-select option { background: var(--card); color: var(--text); }

.header-end { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
.status-dot {
  width: 9px; height: 9px;
  border-radius: 50%;
  background: #4A4F66;
  flex-shrink: 0;
  transition: background 0.2s, box-shadow 0.2s;
  margin: 0 4px;
}
.status-dot.ok { background: var(--success); box-shadow: 0 0 8px rgba(84, 224, 162, 0.6); }
.status-dot.error { background: var(--danger); box-shadow: 0 0 8px rgba(255, 107, 122, 0.6); }
.status-dot.checking { background: var(--warning); animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }

/* ============ BODY (sidebar + main) ============ */
.body-wrap {
  flex: 1;
  display: flex;
  overflow: hidden;
  position: relative;
  min-height: 0;
}

/* ============ SIDEBAR ============ */
.sidebar {
  width: 300px;
  flex-shrink: 0;
  background: var(--card);
  border-inline-end: 1px solid var(--border-soft);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1);
}
@media (max-width: 860px) {
  .sidebar {
    position: absolute;
    inset-block: 0;
    inset-inline-start: 0;
    z-index: 40;
    transform: translateX(100%);
    box-shadow: -8px 0 40px rgba(0, 0, 0, 0.5);
    width: min(320px, 85vw);
    padding-top: env(safe-area-inset-top, 0px);
  }
  .sidebar.open { transform: translateX(0); }
}

.sidebar-header {
  padding: 14px;
  display: flex;
  gap: 8px;
  align-items: center;
  border-bottom: 1px solid var(--border-soft);
}
.new-chat-btn {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 11px 14px;
  border-radius: var(--radius-sm);
  background: linear-gradient(135deg, rgba(155,123,255,0.2), rgba(86,200,255,0.15));
  border: 1px solid var(--border);
  color: var(--text);
  font-weight: 700;
  font-size: 14px;
  transition: all 0.18s;
}
.new-chat-btn:hover {
  background: linear-gradient(135deg, rgba(155,123,255,0.3), rgba(86,200,255,0.22));
  box-shadow: var(--shadow-glow);
}
.new-chat-btn:active { transform: scale(0.98); }
.new-chat-btn svg { width: 18px; height: 18px; }
.sidebar-close { display: none; }
@media (max-width: 860px) { .sidebar-close { display: flex; } }

.sidebar-search { padding: 10px 14px; }
.sidebar-search input {
  width: 100%;
  background: var(--secondary);
  border: 1px solid var(--border-soft);
  border-radius: var(--radius-sm);
  padding: 9px 12px;
  font-size: 13px;
  outline: none;
  transition: border-color 0.15s;
}
.sidebar-search input:focus { border-color: var(--purple); }

.conv-list {
  flex: 1;
  overflow-y: auto;
  padding: 6px 10px;
  scrollbar-width: thin;
  scrollbar-color: var(--secondary) transparent;
}
.conv-list::-webkit-scrollbar { width: 6px; }
.conv-list::-webkit-scrollbar-thumb { background: var(--secondary); border-radius: 3px; }

.conv-item {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 10px 12px;
  margin-bottom: 4px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: background 0.15s;
  border: 1px solid transparent;
}
.conv-item:hover { background: var(--secondary); }
.conv-item.active {
  background: rgba(155, 123, 255, 0.12);
  border-color: var(--border);
}
.conv-body { flex: 1; min-width: 0; }
.conv-title {
  font-size: 13.5px;
  font-weight: 500;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.conv-meta { font-size: 11px; color: var(--text-sec); margin-top: 2px; }
.conv-actions { display: flex; gap: 2px; opacity: 0; transition: opacity 0.15s; }
.conv-item:hover .conv-actions, .conv-item.active .conv-actions { opacity: 1; }
.conv-action {
  width: 26px; height: 26px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 6px;
  color: var(--text-sec);
  font-size: 13px;
  transition: background 0.15s, color 0.15s;
}
.conv-action:hover { background: var(--card); color: var(--text); }
.conv-action:last-child:hover { color: var(--danger); }

.empty-list {
  padding: 30px 16px;
  text-align: center;
  color: var(--text-sec);
  font-size: 13px;
}

.sidebar-footer {
  border-top: 1px solid var(--border-soft);
  padding: 10px 14px calc(10px + env(safe-area-inset-bottom, 0px));
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}
.footer-btn {
  flex: 1;
  padding: 8px 10px;
  border-radius: 8px;
  background: var(--secondary);
  border: 1px solid var(--border-soft);
  color: var(--text-sec);
  font-size: 12px;
  font-weight: 500;
  transition: all 0.15s;
  min-width: 70px;
}
.footer-btn:hover { color: var(--text); border-color: var(--border); }
.footer-btn.danger:hover { color: var(--danger); border-color: var(--danger); }

.sidebar-backdrop {
  display: none;
  position: absolute;
  inset: 0;
  background: rgba(0, 0, 0, 0.55);
  z-index: 30;
  backdrop-filter: blur(2px);
}
.sidebar-backdrop.active { display: block; }
@media (min-width: 861px) { .sidebar-backdrop { display: none !important; } }

/* ============ MAIN CHAT AREA ============ */
.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
  overflow: hidden;
  position: relative;
}
.messages {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 16px 14px 24px;
  scroll-behavior: smooth;
  min-height: 0;
  scrollbar-width: thin;
  scrollbar-color: var(--secondary) transparent;
}
.messages::-webkit-scrollbar { width: 8px; }
.messages::-webkit-scrollbar-thumb { background: var(--secondary); border-radius: 4px; }

.welcome {
  max-width: 620px;
  margin: 8vh auto 0;
  padding: 20px;
  text-align: center;
}
.welcome-logo {
  width: 68px; height: 68px;
  margin: 0 auto 16px;
  border-radius: 18px;
  background: linear-gradient(135deg, var(--purple), var(--blue));
  display: flex; align-items: center; justify-content: center;
  font-size: 30px;
  font-weight: 800;
  color: #fff;
  box-shadow: 0 0 40px rgba(155, 123, 255, 0.5);
  animation: float 4s ease-in-out infinite;
}
@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-6px); }
}
.welcome h1 {
  font-size: 26px;
  font-weight: 800;
  margin-bottom: 6px;
  background: linear-gradient(135deg, var(--text), var(--purple));
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
}
.welcome > p {
  color: var(--text-sec);
  margin-bottom: 28px;
  font-size: 14.5px;
}
.suggestions {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 10px;
  text-align: start;
}
.suggestion {
  padding: 14px 16px;
  background: var(--card);
  border: 1px solid var(--border-soft);
  border-radius: var(--radius-sm);
  color: var(--text);
  font-size: 13.5px;
  text-align: start;
  transition: all 0.18s;
  font-weight: 500;
}
.suggestion:hover {
  border-color: var(--purple);
  background: var(--secondary);
  transform: translateY(-1px);
  box-shadow: 0 4px 16px rgba(155,123,255,0.15);
}
.suggestion:active { transform: scale(0.98); }

/* ============ MESSAGES ============ */
.message {
  display: flex;
  gap: 10px;
  margin-bottom: 20px;
  max-width: 900px;
  margin-inline: auto;
  animation: msgIn 0.25s ease-out;
}
@keyframes msgIn {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}
.message.user { flex-direction: row-reverse; }

.avatar {
  width: 32px; height: 32px;
  border-radius: 9px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 800;
  font-size: 13px;
  color: #fff;
}
.avatar.user { background: linear-gradient(135deg, var(--blue), #3A8DBA); }
.avatar.assistant {
  background: linear-gradient(135deg, var(--purple), var(--blue));
  box-shadow: 0 0 12px rgba(155, 123, 255, 0.35);
}

.msg-inner { min-width: 0; flex: 1; max-width: 100%; }
.message.user .msg-inner { display: flex; flex-direction: column; align-items: flex-end; }

.bubble {
  padding: 12px 16px;
  border-radius: var(--radius);
  font-size: 14.5px;
  line-height: 1.7;
  max-width: 100%;
  overflow-wrap: anywhere;
  word-break: break-word;
}
.message.user .bubble {
  background: linear-gradient(135deg, rgba(86,200,255,0.14), rgba(155,123,255,0.1));
  border: 1px solid rgba(86,200,255,0.2);
  border-top-left-radius: 4px;
}
.message.assistant .bubble {
  background: var(--card);
  border: 1px solid var(--border-soft);
  border-top-right-radius: 4px;
}

.msg-content { overflow-wrap: anywhere; word-break: break-word; }
.msg-content > *:first-child { margin-top: 0; }
.msg-content > *:last-child { margin-bottom: 0; }
.msg-content p { white-space: pre-wrap; margin: 0 0 10px; }
.msg-content h1, .msg-content h2, .msg-content h3, .msg-content h4 {
  margin: 14px 0 8px;
  font-weight: 700;
  line-height: 1.4;
}
.msg-content h1 { font-size: 20px; }
.msg-content h2 { font-size: 18px; }
.msg-content h3 { font-size: 16px; }
.msg-content h4 { font-size: 15px; }
.msg-content ul, .msg-content ol { margin: 8px 0 12px; padding-inline-start: 22px; }
.msg-content li { margin-bottom: 4px; white-space: pre-wrap; }
.msg-content blockquote {
  border-inline-start: 3px solid var(--purple);
  padding: 4px 12px;
  margin: 10px 0;
  background: rgba(155,123,255,0.06);
  border-radius: 6px;
  color: var(--text-sec);
  font-style: italic;
}
.msg-content strong { font-weight: 700; color: var(--text); }
.msg-content em { font-style: italic; }
.msg-content code:not(pre code) {
  font-family: var(--mono);
  font-size: 0.9em;
  background: rgba(155,123,255,0.12);
  padding: 2px 6px;
  border-radius: 5px;
  color: var(--blue);
  white-space: nowrap;
}
.msg-content a { color: var(--blue); word-break: break-all; }

.typing { display: inline-flex; gap: 4px; padding: 4px 0; }
.typing span {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--purple);
  opacity: 0.4;
  animation: typing 1.2s ease-in-out infinite;
}
.typing span:nth-child(2) { animation-delay: 0.15s; }
.typing span:nth-child(3) { animation-delay: 0.3s; }
@keyframes typing {
  0%, 60%, 100% { opacity: 0.3; transform: translateY(0); }
  30% { opacity: 1; transform: translateY(-4px); }
}

.incomplete-badge {
  display: inline-block;
  margin-top: 6px;
  font-size: 11px;
  color: var(--warning);
  padding: 3px 8px;
  border-radius: 6px;
  background: rgba(255, 200, 87, 0.12);
}

.msg-actions {
  display: flex;
  gap: 6px;
  margin-top: 6px;
  padding: 0 2px;
}
.msg-action-btn {
  font-size: 11.5px;
  color: var(--text-sec);
  padding: 4px 10px;
  border-radius: 6px;
  background: transparent;
  border: 1px solid transparent;
  transition: all 0.15s;
  display: inline-flex;
  align-items: center;
  gap: 4px;
}
.msg-action-btn:hover {
  background: var(--secondary);
  color: var(--text);
  border-color: var(--border-soft);
}

/* ============ CODE CARDS ============ */
.code-card {
  margin: 12px 0;
  border-radius: var(--radius-sm);
  overflow: hidden;
  border: 1px solid var(--border);
  background: #0D0F1A;
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
  max-width: 100%;
  position: relative;
}
.code-card::before {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: inherit;
  pointer-events: none;
  box-shadow: inset 0 1px 0 rgba(155, 123, 255, 0.08);
}
.code-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 12px;
  background: linear-gradient(135deg, rgba(155,123,255,0.08), rgba(86,200,255,0.05));
  border-bottom: 1px solid var(--border-soft);
  gap: 8px;
}
.code-lang {
  font-family: var(--mono);
  font-size: 11.5px;
  font-weight: 500;
  color: var(--purple);
  text-transform: lowercase;
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
  overflow: hidden;
}
.code-lang .file-name {
  color: var(--text-sec);
  font-family: var(--font);
  font-size: 11.5px;
  font-weight: 500;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.code-lang .file-name::after { content: '•'; margin-inline-start: 6px; color: var(--text-sec); opacity: 0.5; }

.copy-btn {
  font-size: 11.5px;
  padding: 4px 10px;
  border-radius: 6px;
  background: var(--secondary);
  border: 1px solid var(--border-soft);
  color: var(--text-sec);
  font-weight: 500;
  transition: all 0.15s;
  flex-shrink: 0;
  white-space: nowrap;
}
.copy-btn:hover { color: var(--text); border-color: var(--purple); }
.copy-btn:active { transform: scale(0.96); }
.copy-btn.copied { color: var(--success); border-color: var(--success); }

.code-card pre {
  margin: 0;
  padding: 14px;
  overflow-x: auto;
  overflow-y: auto;
  max-height: 500px;
  font-family: var(--mono);
  font-size: 13px;
  line-height: 1.65;
  direction: ltr;
  text-align: left;
  tab-size: 2;
  -moz-tab-size: 2;
  scrollbar-width: thin;
  scrollbar-color: var(--secondary) transparent;
}
.code-card pre::-webkit-scrollbar { height: 8px; width: 8px; }
.code-card pre::-webkit-scrollbar-thumb { background: var(--secondary); border-radius: 4px; }
.code-card code {
  font-family: inherit;
  white-space: pre;
  color: #D6DBF0;
  display: block;
}
.code-card.incomplete { border-color: rgba(255,200,87,0.3); }
.incomplete-note {
  padding: 6px 12px;
  font-size: 11px;
  color: var(--warning);
  background: rgba(255,200,87,0.08);
  border-top: 1px solid rgba(255,200,87,0.15);
  font-family: var(--font);
}

/* ============ COMPOSER ============ */
.composer {
  flex-shrink: 0;
  padding: 10px 12px calc(10px + env(safe-area-inset-bottom, 0px));
  background: linear-gradient(to top, var(--bg) 60%, transparent);
  position: relative;
}
.composer-inner {
  max-width: 860px;
  margin: 0 auto;
  display: flex;
  align-items: flex-end;
  gap: 8px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 8px 8px 8px 8px;
  transition: border-color 0.18s, box-shadow 0.18s;
}
.composer-inner:focus-within {
  border-color: var(--purple);
  box-shadow: 0 0 0 3px rgba(155,123,255,0.12), var(--shadow-glow);
}
#input {
  flex: 1;
  background: transparent;
  border: none;
  outline: none;
  color: var(--text);
  font-size: 15px;
  line-height: 1.5;
  resize: none;
  padding: 8px 10px;
  max-height: 200px;
  min-height: 24px;
  font-family: var(--font);
}
#input::placeholder { color: var(--text-sec); opacity: 0.7; }

.send-btn, .stop-btn {
  width: 40px; height: 40px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: all 0.15s;
}
.send-btn {
  background: linear-gradient(135deg, var(--purple), var(--blue));
  color: #fff;
  box-shadow: 0 4px 14px rgba(155, 123, 255, 0.35);
}
.send-btn:hover { filter: brightness(1.1); }
.send-btn:active { transform: scale(0.94); }
.send-btn:disabled {
  opacity: 0.4;
  cursor: not-allowed;
  box-shadow: none;
  background: var(--secondary);
  color: var(--text-sec);
}
.stop-btn {
  background: rgba(255, 107, 122, 0.15);
  border: 1px solid rgba(255, 107, 122, 0.3);
  color: var(--danger);
}
.stop-btn:hover { background: rgba(255, 107, 122, 0.25); }
.stop-btn svg, .send-btn svg { width: 18px; height: 18px; }

.composer-hint {
  max-width: 860px;
  margin: 6px auto 0;
  text-align: center;
  font-size: 11px;
  color: var(--text-sec);
  opacity: 0.65;
}

/* ============ SCROLL BTN ============ */
.scroll-btn {
  position: absolute;
  bottom: 90px;
  left: 50%;
  transform: translateX(-50%);
  width: 38px; height: 38px;
  border-radius: 50%;
  background: var(--card);
  border: 1px solid var(--border);
  color: var(--text);
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: var(--shadow-soft);
  z-index: 5;
  transition: all 0.15s;
}
.scroll-btn:hover { border-color: var(--purple); box-shadow: var(--shadow-glow); }
.scroll-btn svg { width: 18px; height: 18px; }

/* ============ MODAL ============ */
.modal { position: fixed; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center; padding: 16px; }
.modal[hidden] { display: none; }
.modal-backdrop {
  position: absolute;
  inset: 0;
  background: rgba(0, 0, 0, 0.65);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  animation: fadeIn 0.2s ease;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.modal-panel {
  position: relative;
  width: 100%;
  max-width: 520px;
  max-height: 90vh;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 18px;
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6), var(--shadow-glow);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  animation: panelIn 0.25s cubic-bezier(0.22, 1, 0.36, 1);
}
@keyframes panelIn {
  from { opacity: 0; transform: scale(0.96) translateY(8px); }
  to { opacity: 1; transform: scale(1) translateY(0); }
}
.modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 20px;
  border-bottom: 1px solid var(--border-soft);
}
.modal-header h2 { font-size: 17px; font-weight: 700; }
.modal-body { padding: 18px 20px 22px; overflow-y: auto; }

.field { margin-bottom: 14px; }
.field label {
  display: block;
  font-size: 12.5px;
  color: var(--text-sec);
  margin-bottom: 6px;
  font-weight: 500;
}
.field input, .field textarea {
  width: 100%;
  background: var(--secondary);
  border: 1px solid var(--border-soft);
  border-radius: 10px;
  padding: 10px 12px;
  font-size: 14px;
  outline: none;
  transition: border-color 0.15s, box-shadow 0.15s;
}
.field input:focus { border-color: var(--purple); box-shadow: 0 0 0 3px rgba(155,123,255,0.1); }
.field .hint {
  display: block;
  font-size: 11.5px;
  color: var(--text-sec);
  margin-top: 6px;
  line-height: 1.5;
}
.field .hint.warn { color: var(--warning); }

.input-group { display: flex; gap: 6px; }
.input-group input { flex: 1; }
.input-group .icon-btn {
  background: var(--secondary);
  border: 1px solid var(--border-soft);
}
.field-row {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 8px;
}
@media (max-width: 420px) { .field-row { grid-template-columns: 1fr; } }

.field-actions {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 18px;
}
.btn {
  padding: 10px 16px;
  border-radius: 10px;
  background: var(--secondary);
  border: 1px solid var(--border-soft);
  color: var(--text);
  font-size: 13.5px;
  font-weight: 600;
  transition: all 0.15s;
  flex: 1;
  min-width: 100px;
}
.btn:hover { border-color: var(--border); background: rgba(155,123,255,0.08); }
.btn:active { transform: scale(0.98); }
.btn.primary {
  background: linear-gradient(135deg, var(--purple), var(--blue));
  border-color: transparent;
  color: #fff;
  box-shadow: 0 4px 14px rgba(155,123,255,0.3);
}
.btn.primary:hover { filter: brightness(1.1); }
.btn.danger { color: var(--danger); }
.btn.danger:hover { border-color: var(--danger); background: rgba(255,107,122,0.08); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }

/* ============ TOAST ============ */
.toast-container {
  position: fixed;
  bottom: 100px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 200;
  display: flex;
  flex-direction: column;
  gap: 8px;
  align-items: center;
  pointer-events: none;
  width: 100%;
  padding: 0 16px;
}
.toast {
  padding: 10px 16px;
  border-radius: 10px;
  background: var(--card);
  border: 1px solid var(--border);
  color: var(--text);
  font-size: 13px;
  font-weight: 500;
  box-shadow: var(--shadow-soft);
  animation: toastIn 0.3s ease-out;
  max-width: 400px;
  pointer-events: auto;
}
.toast.success { border-color: rgba(84,224,162,0.4); color: var(--success); }
.toast.error { border-color: rgba(255,107,122,0.4); color: var(--danger); }
@keyframes toastIn {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ============ RESPONSIVE ============ */
@media (min-width: 861px) {
  .sidebar-backdrop { display: none; }
  #sidebarToggle { display: none; }
}
@media (max-width: 860px) {
  .messages { padding: 14px 10px 20px; }
  .bubble { font-size: 14px; padding: 10px 13px; }
  .code-card pre { font-size: 12px; }
  .welcome { margin-top: 4vh; }
  .welcome h1 { font-size: 22px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.001ms !important;
    transition-duration: 0.001ms !important;
  }
  .messages { scroll-behavior: auto; }
}

/* utility */
[hidden] { display: none !important; }
</style>
</head>

  <div class="body-wrap">

<script>
(function () {
  'use strict';

  /* ============================================================
     DOM REFERENCES
     ============================================================ */
  const $ = (sel, root) => (root || document).querySelector(sel);
  const $$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));

  const el = {
    sidebar: $('#sidebar'),
    sidebarBackdrop: $('#sidebarBackdrop'),
    sidebarToggle: $('#sidebarToggle'),
    sidebarClose: $('#sidebarClose'),
    newChatBtn: $('#newChatBtn'),
    searchInput: $('#searchInput'),
    convList: $('#convList'),
    exportBtn: $('#exportBtn'),
    importBtn: $('#importBtn'),
    clearAllBtn: $('#clearAllBtn'),
    modelSelect: $('#modelSelect'),
    refreshModels: $('#refreshModels'),
    statusDot: $('#statusDot'),
    settingsBtn: $('#settingsBtn'),
    messages: $('#messages'),
    scrollBtn: $('#scrollBtn'),
    input: $('#input'),
    sendBtn: $('#sendBtn'),
    stopBtn: $('#stopBtn'),
    settingsModal: $('#settingsModal'),
    apiKeyInput: $('#apiKeyInput'),
    apiBaseInput: $('#apiBaseInput'),
    tempInput: $('#tempInput'),
    topPInput: $('#topPInput'),
    maxTokensInput: $('#maxTokensInput'),
    saveSettings: $('#saveSettings'),
    testConnection: $('#testConnection'),
    clearKey: $('#clearKey'),
    toggleKey: $('#toggleKey'),
    toastContainer: $('#toastContainer')
  };

  /* ============================================================
     STATE
     ============================================================ */
  const STORAGE_SETTINGS = 'radox_settings_v1';
  const STORAGE_CURRENT = 'radox_current_v1';
  const DB_NAME = 'radox_db';
  const DB_VERSION = 1;
  const STORE_CONV = 'conversations';

  const state = {
    settings: {
      apiBase: 'https://radoxai.com/v1',
      apiKey: '',
      temperature: 0.7,
      topP: 1,
      maxTokens: 0
    },
    models: [],
    currentModel: '',
    conversations: [],
    currentId: null,
    isGenerating: false,
    abortController: null,
    connectionStatus: 'unknown',
    streamingEl: null,
    streamingMsg: null,
    userScrolledUp: false,
    pendingRender: null
  };

  /* ============================================================
     STORAGE (IndexedDB for conversations, LocalStorage for settings)
     ============================================================ */
  const store = {
    _dbPromise: null,
    open() {
      if (this._dbPromise) return this._dbPromise;
      this._dbPromise = new Promise((resolve, reject) => {
        if (!('indexedDB' in window)) {
          reject(new Error('IndexedDB غير مدعوم'));
          return;
        }
        const req = indexedDB.open(DB_NAME, DB_VERSION);
        req.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains(STORE_CONV)) {
            db.createObjectStore(STORE_CONV, { keyPath: 'id' });
          }
        };
        req.onsuccess = (e) => resolve(e.target.result);
        req.onerror = (e) => reject(e.target.error || new Error('فشل فتح قاعدة البيانات'));
      });
      return this._dbPromise;
    },
    async put(conv) {
      const db = await this.open();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_CONV, 'readwrite');
        tx.objectStore(STORE_CONV).put(conv);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    },
    async getAll() {
      const db = await this.open();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_CONV, 'readonly');
        const req = tx.objectStore(STORE_CONV).getAll();
        req.onsuccess = () => resolve(req.result || []);
        req.onerror = () => reject(req.error);
      });
    },
    async delete(id) {
      const db = await this.open();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_CONV, 'readwrite');
        tx.objectStore(STORE_CONV).delete(id);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    },
    async clear() {
      const db = await this.open();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_CONV, 'readwrite');
        tx.objectStore(STORE_CONV).clear();
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    }
  };

  function loadSettings() {
    try {
      const raw = localStorage.getItem(STORAGE_SETTINGS);
      if (raw) {
        const s = JSON.parse(raw);
        Object.assign(state.settings, {
          apiBase: s.apiBase || state.settings.apiBase,
          apiKey: s.apiKey || '',
          temperature: typeof s.temperature === 'number' ? s.temperature : 0.7,
          topP: typeof s.topP === 'number' ? s.topP : 1,
          maxTokens: typeof s.maxTokens === 'number' ? s.maxTokens : 0
        });
        state.currentModel = s.currentModel || '';
      }
      const cur = localStorage.getItem(STORAGE_CURRENT);
      if (cur) state.currentId = cur;
    } catch (e) { /* ignore */ }
  }

  function saveSettings() {
    try {
      localStorage.setItem(STORAGE_SETTINGS, JSON.stringify({
        apiBase: state.settings.apiBase,
        apiKey: state.settings.apiKey,
        temperature: state.settings.temperature,
        topP: state.settings.topP,
        maxTokens: state.settings.maxTokens,
        currentModel: state.currentModel
      }));
      if (state.currentId) localStorage.setItem(STORAGE_CURRENT, state.currentId);
      else localStorage.removeItem(STORAGE_CURRENT);
    } catch (e) {
      toast('تعذر حفظ الإعدادات محلياً', 'error');
    }
  }

  /* ============================================================
     UTILITIES
     ============================================================ */
  function uid() {
    return 'c_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 8);
  }

  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function toast(msg, type) {
    const t = document.createElement('div');
    t.className = 'toast' + (type ? ' ' + type : '');
    t.textContent = msg;
    el.toastContainer.appendChild(t);
    setTimeout(() => {
      t.style.transition = 'opacity 0.3s';
      t.style.opacity = '0';
      setTimeout(() => t.remove(), 300);
    }, 2600);
  }

  function setConnectionStatus(status) {
    state.connectionStatus = status;
    el.statusDot.className = 'status-dot ' + status;
    const labels = { ok: 'متصل', error: 'خطأ في الاتصال', checking: 'جارٍ الفحص', unknown: 'غير معروف' };
    el.statusDot.title = 'الحالة: ' + (labels[status] || '');
  }

  async function copyText(text) {
    try {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(text);
        return true;
      }
    } catch (e) { /* fallthrough */ }
    try {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.position = 'fixed';
      ta.style.top = '0';
      ta.style.left = '-9999px';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      ta.setSelectionRange(0, text.length);
      const ok = document.execCommand('copy');
      document.body.removeChild(ta);
      return ok;
    } catch (e) {
      return false;
    }
  }

  /* ============================================================
     MARKDOWN PARSER (safe, DOM-based)
     ============================================================ */
  const INLINE_RE = /(\*\*[^*\n]+\*\*|\*[^*\n]+\*|`[^`\n]+`|\[[^\]\n]+\]\([^)\n]+\)|https?:\/\/[^\s<>"]+)/g;
  const SAFE_LINK_PROTOCOLS = ['http:', 'https:', 'mailto:'];

  function renderInline(text) {
    const frag = document.createDocumentFragment();
    if (!text) return frag;
    let lastIndex = 0;
    INLINE_RE.lastIndex = 0;
    let m;
    while ((m = INLINE_RE.exec(text)) !== null) {
      if (m.index > lastIndex) {
        frag.appendChild(document.createTextNode(text.slice(lastIndex, m.index)));
      }
      const tok = m[0];
      if (tok.startsWith('**') && tok.endsWith('**') && tok.length > 4) {
        const b = document.createElement('strong');
        b.textContent = tok.slice(2, -2);
        frag.appendChild(b);
      } else if (tok.startsWith('`') && tok.endsWith('`') && tok.length > 2) {
        const c = document.createElement('code');
        c.textContent = tok.slice(1, -1);
        frag.appendChild(c);
      } else if (tok.startsWith('[')) {
        const lm = tok.match(/^\[([^\]]+)\]\(([^)]+)\)$/);
        if (lm) {
          const a = document.createElement('a');
          a.textContent = lm[1];
          a.href = safeUrl(lm[2]);
          a.target = '_blank';
          a.rel = 'noopener noreferrer nofollow';
          frag.appendChild(a);
        } else {
          frag.appendChild(document.createTextNode(tok));
        }
      } else if (tok.startsWith('*') && tok.endsWith('*') && tok.length > 2) {
        const em = document.createElement('em');
        em.textContent = tok.slice(1, -1);
        frag.appendChild(em);
      } else if (/^https?:\/\//.test(tok)) {
        const a = document.createElement('a');
        a.textContent = tok;
        a.href = safeUrl(tok);
        a.target = '_blank';
        a.rel = 'noopener noreferrer nofollow';
        frag.appendChild(a);
      } else {
        frag.appendChild(document.createTextNode(tok));
      }
      lastIndex = m.index + tok.length;
    }
    if (lastIndex < text.length) {
      frag.appendChild(document.createTextNode(text.slice(lastIndex)));
    }
    return frag;
  }

  function safeUrl(url) {
    try {
      const u = new URL(url, location.href);
      if (SAFE_LINK_PROTOCOLS.includes(u.protocol)) return u.href;
    } catch (e) { /* ignore */ }
    return '#';
  }

  function parseTextBlock(text) {
    const container = document.createElement('div');
    if (!text) return container;
    const lines = text.split('\n');
    let i = 0;
    while (i < lines.length) {
      const line = lines[i];
      if (line.trim() === '') { i++; continue; }

      // Heading
      const hMatch = line.match(/^(#{1,6})\s+(.*)$/);
      if (hMatch) {
        const level = Math.min(hMatch[1].length + 1, 6);
        const h = document.createElement('h' + level);
        h.appendChild(renderInline(hMatch[2]));
        container.appendChild(h);
        i++;
        continue;
      }

      // Blockquote
      if (/^>\s?/.test(line)) {
        const bq = document.createElement('blockquote');
        const quoteLines = [];
        while (i < lines.length && /^>\s?/.test(lines[i])) {
          quoteLines.push(lines[i].replace(/^>\s?/, ''));
          i++;
        }
        bq.appendChild(renderInline(quoteLines.join('\n')));
        container.appendChild(bq);
        continue;
      }

      // Unordered list
      if (/^[-*+]\s+/.test(line)) {
        const ul = document.createElement('ul');
        while (i < lines.length && /^[-*+]\s+/.test(lines[i])) {
          const li = document.createElement('li');
          li.appendChild(renderInline(lines[i].replace(/^[-*+]\s+/, '')));
          ul.appendChild(li);
          i++;
        }
        container.appendChild(ul);
        continue;
      }

      // Ordered list
      if (/^\d+\.\s+/.test(line)) {
        const ol = document.createElement('ol');
        while (i < lines.length && /^\d+\.\s+/.test(lines[i])) {
          const li = document.createElement('li');
          li.appendChild(renderInline(lines[i].replace(/^\d+\.\s+/, '')));
          ol.appendChild(li);
          i++;
        }
        container.appendChild(ol);
        continue;
      }

      // Horizontal rule
      if (/^(---+|\*\*\*+|___+)$/.test(line.trim())) {
        container.appendChild(document.createElement('hr'));
        i++;
        continue;
      }

      // Paragraph - collect until blank line or block start
      const paraLines = [line];
      i++;
      while (i < lines.length) {
        const L = lines[i];
        if (L.trim() === '') break;
        if (/^#{1,6}\s+/.test(L)) break;
        if (/^>\s?/.test(L)) break;
        if (/^[-*+]\s+/.test(L)) break;
        if (/^\d+\.\s+/.test(L)) break;
        if (/^(---+|\*\*\*+|___+)$/.test(L.trim())) break;
        paraLines.push(L);
        i++;
      }
      const p = document.createElement('p');
      p.appendChild(renderInline(paraLines.join('\n')));
      container.appendChild(p);
    }
    return container;
  }

  function parseLangField(rawLang) {
    const clean = (rawLang || '').trim();
    if (!clean) return { lang: '', fileName: '' };
    // Patterns: "html", "html:index.html", "html (index.html)", "html index.html"
    const m = clean.match(/^([A-Za-z0-9+#]+)[\s:(]+([A-Za-z0-9_./-]+\.[A-Za-z0-9]+)/);
    if (m) return { lang: m[1], fileName: m[2] };
    // If just a filename
    if (/^[A-Za-z0-9_./-]+\.[A-Za-z0-9]+$/.test(clean)) {
      return { lang: '', fileName: clean };
    }
    return { lang: clean, fileName: '' };
  }

  function createCodeCard(langRaw, code, complete) {
    const { lang, fileName } = parseLangField(langRaw);
    const card = document.createElement('div');
    card.className = 'code-card' + (complete ? '' : ' incomplete');

    const header = document.createElement('div');
    header.className = 'code-header';

    const langEl = document.createElement('div');
    langEl.className = 'code-lang';
    if (fileName) {
      const fn = document.createElement('span');
      fn.className = 'file-name';
      fn.textContent = fileName;
      langEl.appendChild(fn);
    }
    const l = document.createElement('span');
    l.textContent = lang || 'code';
    langEl.appendChild(l);
    header.appendChild(langEl);

    const copyBtn = document.createElement('button');
    copyBtn.type = 'button';
    copyBtn.className = 'copy-btn';
    copyBtn.textContent = 'نسخ';
    copyBtn.addEventListener('click', async (e) => {
      e.stopPropagation();
      const ok = await copyText(code);
      if (ok) {
        copyBtn.textContent = 'تم النسخ ✓';
        copyBtn.classList.add('copied');
        setTimeout(() => {
          copyBtn.textContent = 'نسخ';
          copyBtn.classList.remove('copied');
        }, 1800);
      } else {
        copyBtn.textContent = 'فشل النسخ';
        setTimeout(() => { copyBtn.textContent = 'نسخ'; }, 1800);
        toast('تعذر النسخ - حدد النص يدوياً', 'error');
      }
    });
    header.appendChild(copyBtn);

    const pre = document.createElement('pre');
    const codeEl = document.createElement('code');
    codeEl.textContent = code;
    pre.appendChild(codeEl);

    card.appendChild(header);
    card.appendChild(pre);

    if (!complete) {
      const note = document.createElement('div');
      note.className = 'incomplete-note';
      note.textContent = '⚠ قد يكون الكود غير مكتمل';
      card.appendChild(note);
    }
    return card;
  }

  function parseMarkdown(text) {
    const frag = document.createDocumentFragment();
    if (!text) return frag;
    // Match either a complete ```lang\n...``` or an unterminated block till end
    const re = /```([A-Za-z0-9_+#.\s:-]*)\n?([\s\S]*?)(```|$)/g;
    let lastIndex = 0;
    let m;
    while ((m = re.exec(text)) !== null) {
      if (m.index > lastIndex) {
        frag.appendChild(parseTextBlock(text.slice(lastIndex, m.index)));
      }
      const rawLang = m[1] || '';
      const code = m[2];
      const complete = m[3] === '```';
      frag.appendChild(createCodeCard(rawLang, code, complete));
      lastIndex = m.index + m[0].length;
      if (!complete) break;
    }
    if (lastIndex < text.length) {
      frag.appendChild(parseTextBlock(text.slice(lastIndex)));
    }
    return frag;
  }

  function renderMessageContent(container, content, streaming) {
    container.textContent = '';
    if (!content) {
      if (streaming) {
        const t = document.createElement('div');
        t.className = 'typing';
        t.innerHTML = '<span></span><span></span><span></span>';
        container.appendChild(t);
      }
      return;
    }
    const frag = parseMarkdown(content);
    container.appendChild(frag);
  }

  /* ============================================================
     CONVERSATION MANAGEMENT
     ============================================================ */
  function getCurrentConversation() {
    return state.conversations.find(c => c.id === state.currentId) || null;
  }

  async function persistConversation(conv) {
    conv.updatedAt = Date.now();
    try {
      await store.put(conv);
    } catch (e) {
      toast('تعذر حفظ المحادثة (المساحة ممتلئة؟)', 'error');
    }
  }

  async function createConversation() {
    const conv = {
      id: uid(),
      title: 'محادثة جديدة',
      model: state.currentModel || '',
      messages: [],
      createdAt: Date.now(),
      updatedAt: Date.now()
    };
    state.conversations.unshift(conv);
    state.currentId = conv.id;
    saveSettings();
    await persistConversation(conv);
    renderConversationList(el.searchInput.value);
    renderMessages();
    return conv;
  }

  async function openConversation(id) {
    if (state.isGenerating) {
      toast('أوقف التوليد أولاً', 'error');
      return;
    }
    state.currentId = id;
    saveSettings();
    const conv = getCurrentConversation();
    if (conv && conv.model) {
      state.currentModel = conv.model;
      if (el.modelSelect.querySelector('option[value="' + CSS.escape(conv.model) + '"]')) {
        el.modelSelect.value = conv.model;
      }
    }
    renderConversationList(el.searchInput.value);
    renderMessages();
    closeSidebarOnMobile();
  }

  async function deleteConversation(id) {
    if (!confirm('حذف هذه المحادثة نهائياً؟')) return;
    try { await store.delete(id); } catch (e) { /* ignore */ }
    state.conversations = state.conversations.filter(c => c.id !== id);
    if (state.currentId === id) {
      state.currentId = state.conversations[0]?.id || null;
      saveSettings();
      renderMessages();
    }
    renderConversationList(el.searchInput.value);
    toast('تم حذف المحادثة', 'success');
  }

  async function renameConversation(id) {
    const conv = state.conversations.find(c => c.id === id);
    if (!conv) return;
    const name = prompt('اسم المحادثة الجديد:', conv.title);
    if (name === null) return;
    const trimmed = name.trim();
    if (!trimmed) return;
    conv.title = trimmed.slice(0, 80);
    await persistConversation(conv);
    renderConversationList(el.searchInput.value);
    toast('تمت إعادة التسمية', 'success');
  }

  async function clearAllConversations() {
    if (!confirm('مسح جميع المحادثات نهائياً؟ لا يمكن التراجع.')) return;
    try { await store.clear(); } catch (e) { /* ignore */ }
    state.conversations = [];
    state.currentId = null;
    saveSettings();
    renderConversationList('');
    renderMessages();
    toast('تم مسح السجل', 'success');
  }

  /* ============================================================
     RENDERING
     ============================================================ */
  function renderConversationList(filter) {
    filter = (filter || '').toLowerCase().trim();
    el.convList.textContent = '';
    const filtered = state.conversations
      .filter(c => !filter || (c.title || '').toLowerCase().includes(filter))
      .sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));

    if (filtered.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'empty-list';
      empty.textContent = filter ? 'لا نتائج مطابقة' : 'لا محادثات بعد';
      el.convList.appendChild(empty);
      return;
    }

    filtered.forEach(c => {
      const item = document.createElement('div');
      item.className = 'conv-item' + (c.id === state.currentId ? ' active' : '');
      item.dataset.id = c.id;

      const body = document.createElement('div');
      body.className = 'conv-body';
      const title = document.createElement('div');
      title.className = 'conv-title';
      title.textContent = c.title || 'محادثة';
      const meta = document.createElement('div');
      meta.className = 'conv-meta';
      try {
        meta.textContent = new Date(c.updatedAt || c.createdAt).toLocaleDateString('ar-EG');
      } catch (e) { meta.textContent = ''; }
      body.appendChild(title);
      body.appendChild(meta);

      const actions = document.createElement('div');
      actions.className = 'conv-actions';
      const ren = document.createElement('button');
      ren.className = 'conv-action';
      ren.title = 'إعادة تسمية';
      ren.textContent = '✎';
      ren.addEventListener('click', (ev) => { ev.stopPropagation(); renameConversation(c.id); });
      const del = document.createElement('button');
      del.className = 'conv-action';
      del.title = 'حذف';
      del.textContent = '✕';
      del.addEventListener('click', (ev) => { ev.stopPropagation(); deleteConversation(c.id); });
      actions.appendChild(ren);
      actions.appendChild(del);

      item.appendChild(body);
      item.appendChild(actions);
      item.addEventListener('click', () => openConversation(c.id));
      el.convList.appendChild(item);
    });
  }

  function renderModelSelect() {
    el.modelSelect.textContent = '';
    if (state.models.length === 0) {
      const opt = document.createElement('option');
      opt.value = '';
      opt.textContent = state.settings.apiKey ? 'لا توجد نماذج (اضغط تحديث)' : 'أدخل مفتاح API أولاً';
      el.modelSelect.appendChild(opt);
      el.modelSelect.disabled = true;
      return;
    }
    el.modelSelect.disabled = false;
    let selectedExists = false;
    state.models.forEach(m => {
      const opt = document.createElement('option');
      opt.value = m.id;
      opt.textContent = m.name;
      if (m.id === state.currentModel) { opt.selected = true; selectedExists = true; }
      el.modelSelect.appendChild(opt);
    });
    if (!selectedExists) {
      state.currentModel = state.models[0].id;
      el.modelSelect.value = state.currentModel;
      saveSettings();
    }
  }

  function renderWelcome() {
    el.messages.textContent = '';
    const welcome = document.createElement('div');
    welcome.className = 'welcome';
    welcome.innerHTML =
      '<div class="welcome-logo">R</div>' +
      '<h1>Radox AI Studio</h1>' +
      '<p>مساحة ذكية للحوار والبرمجة</p>' +
      '<div class="suggestions">' +
        '<button class="suggestion" data-prompt="اكتب لي كود HTML لصفحة هبوط احترافية بتصميم داكن">صفحة هبوط HTML</button>' +
        '<button class="suggestion" data-prompt="اشرح لي الفرق بين let و const في JavaScript مع أمثلة">let vs const</button>' +
        '<button class="suggestion" data-prompt="اكتب دالة Python لترتيب قائمة من الأرقام تصاعدياً">دالة Python</button>' +
        '<button class="suggestion" data-prompt="صمم لي واجهة CSS بتأثير Glassmorphism أنيق">Glassmorphism</button>' +
      '</div>';
    el.messages.appendChild(welcome);
    $$('.suggestion', welcome).forEach(btn => {
      btn.addEventListener('click', () => {
        el.input.value = btn.dataset.prompt || '';
        autoResize();
        el.input.focus();
      });
    });
  }

  function buildMessageEl(msg, index) {
    const wrap = document.createElement('div');
    wrap.className = 'message ' + msg.role;
    wrap.dataset.msgIndex = String(index);

    const avatar = document.createElement('div');
    avatar.className = 'avatar ' + msg.role;
    avatar.textContent = msg.role === 'user' ? 'أ' : 'R';

    const inner = document.createElement('div');
    inner.className = 'msg-inner';

    const bubble = document.createElement('div');
    bubble.className = 'bubble';

    const content = document.createElement('div');
    content.className = 'msg-content';

    if (msg.role === 'assistant') {
      renderMessageContent(content, msg.content, msg.status === 'streaming');
      if (msg.status === 'stopped') {
        const b = document.createElement('div');
        b.className = 'incomplete-badge';
        b.textContent = '⚠ تم إيقاف التوليد';
        content.appendChild(b);
      } else if (msg.status === 'failed') {
        const b = document.createElement('div');
        b.className = 'incomplete-badge';
        b.textContent = '⚠ حدث خطأ';
        content.appendChild(b);
      }
    } else {
      content.textContent = '';
      const p = document.createElement('p');
      p.style.whiteSpace = 'pre-wrap';
      p.textContent = msg.content;
      content.appendChild(p);
    }

    bubble.appendChild(content);
    inner.appendChild(bubble);

    const actions = document.createElement('div');
    actions.className = 'msg-actions';
    if (msg.role === 'assistant' && msg.content) {
      const copyBtn = document.createElement('button');
      copyBtn.className = 'msg-action-btn';
      copyBtn.textContent = 'نسخ الرد';
      copyBtn.addEventListener('click', async () => {
        const ok = await copyText(msg.content);
        if (ok) {
          copyBtn.textContent = 'تم النسخ ✓';
          setTimeout(() => { copyBtn.textContent = 'نسخ الرد'; }, 1800);
        } else {
          toast('تعذر النسخ', 'error');
        }
      });
      actions.appendChild(copyBtn);
    }
    inner.appendChild(actions);

    wrap.appendChild(avatar);
    wrap.appendChild(inner);
    return wrap;
  }

  function renderMessages() {
    el.messages.textContent = '';
    const conv = getCurrentConversation();
    if (!conv || conv.messages.length === 0) {
      renderWelcome();
      state.userScrolledUp = false;
      return;
    }
    const frag = document.createDocumentFragment();
    conv.messages.forEach((m, idx) => frag.appendChild(buildMessageEl(m, idx)));
    el.messages.appendChild(frag);
    scrollToBottom(true);
  }

  function updateStreamingMessage() {
    if (!state.streamingEl || !state.streamingMsg) return;
    const msg = state.streamingMsg;
    const elc = state.streamingEl.querySelector('.msg-content');
    if (!elc) return;
    if (elc.dataset.lastLen === String(msg.content.length) && msg.status !== 'complete') return;
    elc.dataset.lastLen = String(msg.content.length);
    renderMessageContent(elc, msg.content, msg.status === 'streaming');
    if (state.userScrolledUp === false) scrollToBottom(false);
  }

  function scrollToBottom(force) {
    if (!force && state.userScrolledUp) return;
    try {
      el.messages.scrollTop = el.messages.scrollHeight;
    } catch (e) { /* ignore */ }
  }

  /* ============================================================
     COMPOSER
     ============================================================ */
  function autoResize() {
    el.input.style.height = 'auto';
    const h = Math.min(el.input.scrollHeight, 200);
    el.input.style.height = h + 'px';
  }

  function updateSendState() {
    if (state.isGenerating) {
      el.sendBtn.hidden = true;
      el.stopBtn.hidden = false;
    } else {
      el.sendBtn.hidden = false;
      el.stopBtn.hidden = true;
    }
    el.sendBtn.disabled = state.isGenerating || !el.input.value.trim();
  }

  /* ============================================================
     API
     ============================================================ */
  function normalizeBase(base) {
    let b = (base || '').trim();
    if (!b) b = 'https://radoxai.com/v1';
    b = b.replace(/\/+$/, '');
    return b;
  }

  function apiError(res) {
    if (res.status === 401 || res.status === 403) return 'مفتاح API غير صالح أو منتهي';
    if (res.status === 404) return 'المسار غير موجود - تحقق من عنوان API';
    if (res.status === 429) return 'تجاوزت حدود الطلبات، حاول لاحقاً';
    if (res.status >= 500) return 'خطأ في الخادم (' + res.status + ')';
    return 'فشل الطلب (' + res.status + ')';
  }

  async function fetchModels() {
    if (!state.settings.apiKey) {
      toast('أدخل مفتاح API من الإعدادات أولاً', 'error');
      openSettings();
      return;
    }
    setConnectionStatus('checking');
    el.refreshModels.disabled = true;
    el.refreshModels.classList.add('spinning');
    try {
      const url = normalizeBase(state.settings.apiBase) + '/models';
      const res = await fetch(url, {
        method: 'GET',
        headers: {
          'Authorization': 'Bearer ' + state.settings.apiKey,
          'Accept': 'application/json'
        }
      });
      if (!res.ok) {
        setConnectionStatus('error');
        toast(apiError(res), 'error');
        return;
      }
      let data;
      try { data = await res.json(); } catch (e) {
        setConnectionStatus('error');
        toast('استجابة غير صالحة من الخادم', 'error');
        return;
      }
      const arr = Array.isArray(data?.data) ? data.data : (Array.isArray(data?.models) ? data.models : []);
      const models = arr.map(m => {
        if (typeof m === 'string') return { id: m, name: m };
        return {
          id: m.id || m.name || m.model || '',
          name: m.name || m.id || m.model || ''
        };
      }).filter(m => m.id);

      state.models = models;
      setConnectionStatus('ok');
      renderModelSelect();
      if (models.length === 0) {
        toast('لا توجد نماذج متاحة لهذا الحساب', 'error');
      } else {
        toast('تم تحميل ' + models.length + ' نموذج', 'success');
      }
    } catch (e) {
      setConnectionStatus('error');
      const msg = (e && e.message) || 'خطأ شبكة';
      toast('تعذر الاتصال: ' + msg, 'error');
    } finally {
      el.refreshModels.disabled = false;
      el.refreshModels.classList.remove('spinning');
    }
  }

  async function testConnection() {
    const key = el.apiKeyInput.value.trim();
    const base = normalizeBase(el.apiBaseInput.value);
    if (!key) {
      toast('أدخل مفتاح API أولاً', 'error');
      return;
    }
    el.testConnection.disabled = true;
    el.testConnection.textContent = 'جارٍ الاختبار...';
    try {
      const res = await fetch(base + '/models', {
        method: 'GET',
        headers: { 'Authorization': 'Bearer ' + key, 'Accept': 'application/json' }
      });
      if (res.ok) {
        toast('الاتصال ناجح ✓', 'success');
        setConnectionStatus('ok');
      } else {
        toast(apiError(res), 'error');
        setConnectionStatus('error');
      }
    } catch (e) {
      toast('تعذر الوصول للخادم (قد يكون CORS)', 'error');
      setConnectionStatus('error');
    } finally {
      el.testConnection.disabled = false;
      el.testConnection.textContent = 'اختبار الاتصال';
    }
  }

  /* ============================================================
     CHAT SEND + STREAMING
     ============================================================ */
  async function sendMessage() {
    if (state.isGenerating) return;
    const text = el.input.value.trim();
    if (!text) return;
    if (!state.settings.apiKey) {
      toast('أدخل مفتاح API أولاً', 'error');
      openSettings();
      return;
    }
    if (!state.currentModel) {
      toast('اختر نموذجاً أولاً', 'error');
      return;
    }

    // ensure conversation
    if (!state.currentId || !getCurrentConversation()) {
      await createConversation();
    }
    const conv = getCurrentConversation();
    if (!conv) return;

    const userMsg = { role: 'user', content: text, status: 'complete' };
    conv.messages.push(userMsg);
    if (conv.messages.filter(m => m.role === 'user').length === 1) {
      conv.title = text.slice(0, 60) + (text.length > 60 ? '…' : '');
    }
    conv.model = state.currentModel;

    el.input.value = '';
    autoResize();
    updateSendState();

    // Render user msg + placeholder
    renderMessages();
    scrollToBottom(true);
    await persistConversation(conv);

    const assistantMsg = { role: 'assistant', content: '', status: 'streaming' };
    conv.messages.push(assistantMsg);

    // Append empty assistant bubble
    const wrap = buildMessageEl(assistantMsg, conv.messages.length - 1);
    el.messages.appendChild(wrap);
    state.streamingEl = wrap;
    state.streamingMsg = assistantMsg;

    state.isGenerating = true;
    updateSendState();
    scrollToBottom(true);

    const controller = new AbortController();
    state.abortController = controller;

    // Build context: all messages except the empty streaming assistant
    const context = conv.messages
      .slice(0, -1)
      .filter(m => m.role === 'user' || m.role === 'assistant')
      .filter(m => m.content)
      .map(m => ({ role: m.role, content: m.content }));

    const body = {
      model: state.currentModel,
      messages: context,
      stream: true
    };
    if (typeof state.settings.temperature === 'number') body.temperature = state.settings.temperature;
    if (typeof state.settings.topP === 'number') body.top_p = state.settings.topP;
    if (typeof state.settings.maxTokens === 'number' && state.settings.maxTokens > 0) body.max_tokens = state.settings.maxTokens;

    let accumulated = '';
    let rafPending = false;
    const scheduleUpdate = () => {
      if (rafPending) return;
      rafPending = true;
      requestAnimationFrame(() => {
        rafPending = false;
        updateStreamingMessage();
      });
    };

    try {
      const url = normalizeBase(state.settings.apiBase) + '/chat/completions';
      const res = await fetch(url, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + state.settings.apiKey,
          'Accept': 'text/event-stream'
        },
        body: JSON.stringify(body),
        signal: controller.signal
      });

      if (!res.ok) {
        throw new Error(apiError(res));
      }

      const ctype = (res.headers.get('content-type') || '').toLowerCase();

      if (ctype.indexOf('text/event-stream') === -1 && ctype.indexOf('stream') === -1) {
        // Non-streaming
        let data;
        try { data = await res.json(); } catch (e) {
          throw new Error('استجابة غير صالحة من الخادم');
        }
        const c = data?.choices?.[0]?.message?.content || '';
        if (!c) throw new Error('رد فارغ من الخادم');
        accumulated = c;
        assistantMsg.content = accumulated;
        updateStreamingMessage();
      } else {
        const reader = res.body.getReader();
        const decoder = new TextDecoder('utf-8');
        let buffer = '';
        let done = false;

        while (!done) {
          const readRes = await reader.read();
          if (readRes.done) { done = true; break; }
          buffer += decoder.decode(readRes.value, { stream: true });
          let nl;
          let consumed = 0;
          // Process complete lines
          while ((nl = buffer.indexOf('\n', consumed)) !== -1) {
            const line = buffer.slice(consumed, nl).replace(/\r$/, '');
            consumed = nl + 1;
            if (!line) continue;
            if (line.startsWith('data:')) {
              const payload = line.slice(5).trim();
              if (payload === '[DONE]') { done = true; break; }
              if (!payload) continue;
              let json;
              try { json = JSON.parse(payload); } catch (e) { continue; }
              if (json.error) {
                throw new Error(json.error.message || 'خطأ في البث');
              }
              const delta = json?.choices?.[0]?.delta?.content;
              if (delta) {
                accumulated += delta;
                assistantMsg.content = accumulated;
                scheduleUpdate();
              } else {
                // Some providers send full message in choices[0].message on final chunk
                const fullMsg = json?.choices?.[0]?.message?.content;
                if (fullMsg && fullMsg.length > accumulated.length) {
                  accumulated = fullMsg;
                  assistantMsg.content = accumulated;
                  scheduleUpdate();
                }
              }
            }
          }
          buffer = buffer.slice(consumed);
        }
        // process tail
        if (buffer.trim()) {
          const tail = buffer.trim();
          if (tail.startsWith('data:')) {
            const payload = tail.slice(5).trim();
            if (payload && payload !== '[DONE]') {
              try {
                const json = JSON.parse(payload);
                const delta = json?.choices?.[0]?.delta?.content;
                if (delta) {
                  accumulated += delta;
                  assistantMsg.content = accumulated;
                }
              } catch (e) { /* ignore partial */ }
            }
          }
        }
        if (!accumulated) throw new Error('رد فارغ من الخادم');
        assistantMsg.content = accumulated;
        updateStreamingMessage();
      }

      assistantMsg.status = 'complete';
    } catch (e) {
      if (e.name === 'AbortError') {
        assistantMsg.status = 'stopped';
        if (!assistantMsg.content) assistantMsg.content = '';
      } else {
        assistantMsg.status = 'failed';
        if (!assistantMsg.content) assistantMsg.content = '⚠ ' + ((e && e.message) || 'خطأ غير متوقع');
        toast((e && e.message) || 'فشل الطلب', 'error');
        setConnectionStatus('error');
      }
      // Update streaming el badge
      updateStreamingMessage();
      const contentEl = state.streamingEl?.querySelector('.msg-content');
      if (contentEl && assistantMsg.status === 'stopped') {
        const b = document.createElement('div');
        b.className = 'incomplete-badge';
        b.textContent = '⚠ تم إيقاف التوليد';
        contentEl.appendChild(b);
      } else if (contentEl && assistantMsg.status === 'failed') {
        const b = document.createElement('div');
        b.className = 'incomplete-badge';
        b.textContent = '⚠ حدث خطأ';
        contentEl.appendChild(b);
      }
    } finally {
      state.isGenerating = false;
      state.abortController = null;
      state.streamingEl = null;
      state.streamingMsg = null;
      updateSendState();
      await persistConversation(conv);
      renderConversationList(el.searchInput.value);
      // Add copy button to finished assistant
      if (conv.messages[conv.messages.length - 1] === assistantMsg) {
        const idx = conv.messages.length - 1;
        const msgEl = el.messages.querySelector('[data-msg-index="' + idx + '"]');
        if (msgEl) {
          const actions = msgEl.querySelector('.msg-actions');
          if (actions && !actions.querySelector('.msg-action-btn')) {
            const copyBtn = document.createElement('button');
            copyBtn.className = 'msg-action-btn';
            copyBtn.textContent = 'نسخ الرد';
            copyBtn.addEventListener('click', async () => {
              const ok = await copyText(assistantMsg.content);
              if (ok) {
                copyBtn.textContent = 'تم النسخ ✓';
                setTimeout(() => { copyBtn.textContent = 'نسخ الرد'; }, 1800);
              }
            });
            actions.appendChild(copyBtn);
          }
        }
      }
    }
  }

  function stopGeneration() {
    if (state.abortController) {
      try { state.abortController.abort(); } catch (e) { /* ignore */ }
    }
  }

  /* ============================================================
     SIDEBAR
     ============================================================ */
  function openSidebar() {
    el.sidebar.classList.add('open');
    el.sidebarBackdrop.classList.add('active');
  }
  function closeSidebar() {
    el.sidebar.classList.remove('open');
    el.sidebarBackdrop.classList.remove('active');
  }
  function closeSidebarOnMobile() {
    if (window.matchMedia('(max-width: 860px)').matches) closeSidebar();
  }

  /* ============================================================
     SETTINGS MODAL
     ============================================================ */
  function openSettings() {
    el.apiKeyInput.value = state.settings.apiKey || '';
    el.apiBaseInput.value = state.settings.apiBase || 'https://radoxai.com/v1';
    el.tempInput.value = state.settings.temperature;
    el.topPInput.value = state.settings.topP;
    el.maxTokensInput.value = state.settings.maxTokens;
    el.settingsModal.hidden = false;
  }
  function closeSettings() {
    el.settingsModal.hidden = true;
  }

  function saveSettingsFromForm() {
    const key = el.apiKeyInput.value.trim();
    const base = normalizeBase(el.apiBaseInput.value);
    const temp = parseFloat(el.tempInput.value);
    const topP = parseFloat(el.topPInput.value);
    const maxT = parseInt(el.maxTokensInput.value, 10);

    state.settings.apiKey = key;
    state.settings.apiBase = base;
    state.settings.temperature = isNaN(temp) ? 0.7 : Math.min(2, Math.max(0, temp));
    state.settings.topP = isNaN(topP) ? 1 : Math.min(1, Math.max(0, topP));
    state.settings.maxTokens = isNaN(maxT) || maxT < 0 ? 0 : maxT;

    saveSettings();
    toast('تم حفظ الإعدادات ✓', 'success');
    closeSettings();
  }

  /* ============================================================
     EXPORT / IMPORT
     ============================================================ */
  function exportAll() {
    try {
      const data = {
        app: 'radox-ai-studio',
        version: 1,
        exportedAt: new Date().toISOString(),
        conversations: state.conversations
      };
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'radox-conversations-' + Date.now() + '.json';
      document.body.appendChild(a);
      a.click();
      setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 300);
      toast('تم التصدير ✓', 'success');
    } catch (e) {
      toast('فشل التصدير', 'error');
    }
  }

  function importAll() {
    const inp = document.createElement('input');
    inp.type = 'file';
    inp.accept = 'application/json,.json';
    inp.addEventListener('change', async () => {
      const file = inp.files && inp.files[0];
      if (!file) return;
      if (file.size > 5 * 1024 * 1024) {
        toast('الملف كبير جداً (الحد 5MB)', 'error');
        return;
      }
      try {
        const text = await file.text();
        const data = JSON.parse(text);
        if (!data || !Array.isArray(data.conversations)) {
          toast('ملف غير صالح', 'error');
          return;
        }
        if (!confirm('استيراد ' + data.conversations.length + ' محادثة؟ سيُضاف إلى السجل الحالي.')) return;
        let count = 0;
        for (const c of data.conversations) {
          if (!c || typeof c !== 'object' || !Array.isArray(c.messages)) continue;
          const conv = {
            id: c.id && typeof c.id === 'string' ? c.id + '_imp' + Math.random().toString(36).slice(2, 6) : uid(),
            title: typeof c.title === 'string' ? c.title.slice(0, 100) : 'محادثة مستوردة',
            model: typeof c.model === 'string' ? c.model : '',
            messages: c.messages.filter(m => m && typeof m.content === 'string' && (m.role === 'user' || m.role === 'assistant')).map(m => ({
              role: m.role,
              content: m.content,
              status: 'complete'
            })),
            createdAt: c.createdAt || Date.now(),
            updatedAt: c.updatedAt || Date.now()
          };
          try {
            await store.put(conv);
            state.conversations.unshift(conv);
            count++;
          } catch (e) { /* ignore one */ }
        }
        renderConversationList(el.searchInput.value);
        toast('تم استيراد ' + count + ' محادثة ✓', 'success');
      } catch (e) {
        toast('فشل الاستيراد: ملف غير صالح', 'error');
      }
    });
    inp.click();
  }

  /* ============================================================
     EVENT BINDINGS
     ============================================================ */
  function bindEvents() {
    // Sidebar
    el.sidebarToggle.addEventListener('click', openSidebar);
    el.sidebarClose.addEventListener('click', closeSidebar);
    el.sidebarBackdrop.addEventListener('click', closeSidebar);
    el.newChatBtn.addEventListener('click', async () => {
      if (state.isGenerating) { toast('أوقف التوليد أولاً', 'error'); return; }
      await createConversation();
      closeSidebarOnMobile();
      el.input.focus();
    });
    el.searchInput.addEventListener('input', () => renderConversationList(el.searchInput.value));

    // Settings
    el.settingsBtn.addEventListener('click', openSettings);
    $$('#settingsModal [data-close]').forEach(b => b.addEventListener('click', closeSettings));
    el.saveSettings.addEventListener('click', saveSettingsFromForm);
    el.testConnection.addEventListener('click', testConnection);
    el.clearKey.addEventListener('click', () => {
      if (!confirm('مسح مفتاح API المحفوظ؟')) return;
      state.settings.apiKey = '';
      saveSettings();
      el.apiKeyInput.value = '';
      toast('تم مسح المفتاح', 'success');
    });
    el.toggleKey.addEventListener('click', () => {
      el.apiKeyInput.type = el.apiKeyInput.type === 'password' ? 'text' : 'password';
    });

    // Models
    el.modelSelect.addEventListener('change', () => {
      state.currentModel = el.modelSelect.value;
      const conv = getCurrentConversation();
      if (conv) conv.model = state.currentModel;
      saveSettings();
      if (conv) persistConversation(conv);
    });
    el.refreshModels.addEventListener('click', fetchModels);

    // Composer
    el.input.addEventListener('input', () => { autoResize(); updateSendState(); });
    el.input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && !e.ctrlKey && !e.metaKey) {
        // On mobile: allow Enter for newline in small screens? Send on non-shift anyway per spec
        if (window.matchMedia('(pointer: coarse)').matches) {
          // Let mobile insert newline via Enter, send via button only
          return;
        }
        e.preventDefault();
        if (!state.isGenerating && el.input.value.trim()) sendMessage();
      }
    });
    el.sendBtn.addEventListener('click', () => { if (!state.isGenerating) sendMessage(); });
    el.stopBtn.addEventListener('click', stopGeneration);

    // Scroll behavior
    el.messages.addEventListener('scroll', () => {
      const dist = el.messages.scrollHeight - el.messages.scrollTop - el.messages.clientHeight;
      const nearBottom = dist < 80;
      state.userScrolledUp = !nearBottom;
      el.scrollBtn.hidden = nearBottom;
    }, { passive: true });
    el.scrollBtn.addEventListener('click', () => {
      state.userScrolledUp = false;
      scrollToBottom(true);
    });

    // Export / import / clear
    el.exportBtn.addEventListener('click', exportAll);
    el.importBtn.addEventListener('click', importAll);
    el.clearAllBtn.addEventListener('click', clearAllConversations);

    // Global ESC to close modals
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if (!el.settingsModal.hidden) closeSettings();
        else closeSidebar();
      }
    });
  }

  /* ============================================================
     INIT
     ============================================================ */
  async function init() {
    loadSettings();
    bindEvents();
    autoResize();
    updateSendState();
    setConnectionStatus('unknown');

    try {
      const all = await store.getAll();
      state.conversations = all || [];
    } catch (e) {
      state.conversations = [];
      toast('تعذر تحميل المحادثات المحفوظة', 'error');
    }

    if (state.currentId && !state.conversations.find(c => c.id === state.currentId)) {
      state.currentId = state.conversations[0]?.id || null;
    }
    if (!state.currentId && state.conversations.length > 0) {
      state.currentId = state.conversations[0].id;
    }

    renderConversationList('');
    renderModelSelect();
    renderMessages();

    // Auto-fetch models if API key present
    if (state.settings.apiKey) {
      fetchModels();
    }
  }

  document.addEventListener('DOMContentLoaded', init);
  if (document.readyState === 'loading') {
    // wait
  } else {
    init();
  }
})();
</script>
</body>
</html>
