<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MohaMmAD_WaSSouF - Studio</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary: #4776E6;
            --secondary: #8E54E9;
            --accent-vocal: #ff4757;
            --accent-inst: #1e90ff;
            --bg-base: #f4f5f7;
            --glass-bg: #ffffff;
            --glass-border: rgba(0, 0, 0, 0.06);
            --text-main: #2d3436;
            --text-muted: #636e72;
            --success: #00b894;
            --shadow: 0 8px 25px rgba(0, 0, 0, 0.06);
        }

        * {
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        /* شاشة ثابتة بدون أي تمرير */
        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: var(--bg-base);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* تصغير الحاوية وجعلها أكثر اندماجاً */
        .app-container {
            width: 88%;
            height: 88%;
            max-width: 400px; /* تم تصغير العرض الأقصى */
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 28px;
            padding: 20px 15px;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
        }

        /* الأزرار العلوية */
        .top-controls { position: absolute; top: 15px; right: 15px; left: 15px; display: flex; justify-content: space-between; z-index: 10; }
        .icon-btn {
            background: var(--bg-base); border: 1px solid var(--glass-border); color: var(--text-main);
            width: 36px; height: 36px; border-radius: 10px; display: flex; justify-content: center; align-items: center;
            cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,0.03); transition: transform 0.2s; font-size: 0.9rem;
        }
        .icon-btn:active { transform: scale(0.9); }

        /* قسم البروفايل (الجديد) */
        .profile-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 15px;
            margin-bottom: 10px;
            text-align: center;
        }
        .profile-avatar {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #ffffff;
            box-shadow: 0 4px 15px rgba(71, 118, 230, 0.35);
            margin-bottom: 8px;
            background-color: var(--bg-base);
        }
        .profile-name {
            font-size: 1.1rem;
            font-weight: 900;
            margin: 0;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 0.5px;
        }
        .profile-title {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin: 2px 0 0 0;
            font-weight: 600;
        }

        /* منطقة الرفع */
        .drop-zone {
            flex: 1;
            background: var(--bg-base);
            border: 2px dashed var(--glass-border);
            border-radius: 16px;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            cursor: pointer; transition: all 0.3s; margin: 10px 0;
        }
        .drop-zone i.main-icon { font-size: 2.5rem; color: var(--primary); margin-bottom: 8px; }
        
        .file-details { display: none; flex-direction: column; gap: 5px; align-items: center; margin-top: 10px; }
        .badge { background: var(--glass-bg); border: 1px solid var(--glass-border); padding: 3px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; }

        /* شريط التقدم */
        .progress-wrapper { display: none; flex: 1; flex-direction: column; justify-content: center; margin: 10px 0; }
        .progress-header { display: flex; justify-content: space-between; font-size: 0.85rem; font-weight: 700; margin-bottom: 8px; }
        .progress-track { background: var(--glass-border); height: 10px; border-radius: 10px; overflow: hidden; }
        .progress-bar { height: 100%; width: 0%; background: linear-gradient(90deg, var(--primary), var(--secondary)); transition: width 0.3s; }

        /* قسم النتائج المدمج */
        .results-container { display: none; flex: 1; flex-direction: column; justify-content: space-evenly; margin: 5px 0; }
        .result-card { background: var(--bg-base); border: 1px solid var(--glass-border); border-radius: 14px; padding: 12px; }
        .result-card.vocal { border-right: 4px solid var(--accent-vocal); margin-bottom: 10px; }
        .result-card.inst { border-right: 4px solid var(--accent-inst); }
        
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .card-header h3 { margin: 0; font-size: 0.9rem; display: flex; align-items: center; gap: 6px; }
        .vocal h3 i { color: var(--accent-vocal); }
        .inst h3 i { color: var(--accent-inst); }

        /* مشغل الصوت */
        .custom-player { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
        .play-btn { width: 35px; height: 35px; min-width: 35px; border-radius: 50%; border: none; background: var(--text-main); color: var(--glass-bg); display: flex; justify-content: center; align-items: center; cursor: pointer; font-size: 0.85rem;}
        .timeline-wrapper { flex: 1; display: flex; flex-direction: column; }
        .time-display { display: flex; justify-content: space-between; font-size: 0.65rem; font-weight: 700; color: var(--text-muted); margin-bottom: 3px; }
        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; height: 4px; }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 4px; background: var(--glass-border); border-radius: 5px; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 12px; width: 12px; border-radius: 50%; background: var(--primary); margin-top: -4px; }

        .btn-download-custom { background: var(--glass-bg); border: 1px solid var(--glass-border); color: var(--text-main); width: 100%; padding: 6px; border-radius: 8px; font-weight: 700; cursor: pointer; display: flex; justify-content: center; gap: 6px; font-size: 0.8rem; }

        /* زر المعالجة السفلي */
        .btn-process {
            background: linear-gradient(135deg, var(--primary), var(--secondary)); color: white;
            border: none; width: 100%; padding: 14px; border-radius: 14px; font-size: 1rem; font-weight: 800;
            cursor: pointer; box-shadow: 0 5px 15px rgba(71, 118, 230, 0.25); display: flex; justify-content: center; align-items: center; gap: 8px;
        }
        .btn-process:active { transform: scale(0.98); }
        .btn-process:disabled { opacity: 0.7; pointer-events: none; }

        /* نافذة الإعدادات */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.4);
            z-index: 1000; display: none; justify-content: center; align-items: center; opacity: 0; transition: opacity 0.2s;
        }
        .modal-content {
            background: var(--glass-bg); border: 1px solid var(--glass-border); width: 92%; max-width: 380px;
            border-radius: 20px; padding: 18px; box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            display: grid; grid-template-columns: 1fr 1fr; gap: 8px 12px; align-items: end;
        }
        .modal-header { grid-column: span 2; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--glass-border); padding-bottom: 8px; margin-bottom: 5px; }
        .modal-header h2 { margin: 0; font-size: 1rem; color: var(--text-main); }
        .close-modal { background: none; border: none; font-size: 1.1rem; color: var(--text-muted); cursor: pointer; padding: 0; }
        
        .form-group { display: flex; flex-direction: column; }
        .form-group.full-width { grid-column: span 2; }
        .form-group label { font-size: 0.7rem; font-weight: 700; margin-bottom: 4px; color: var(--text-muted); }
        .form-group select, .form-group input[type="number"] { width: 100%; padding: 6px; border-radius: 8px; background: var(--bg-base); border: 1px solid var(--glass-border); font-size: 0.75rem; font-weight: 600; color: var(--text-main); }
        .form-group input[type="range"] { margin: 4px 0; }
        
        .switch-wrapper { display: flex; justify-content: space-between; align-items: center; background: var(--bg-base); border: 1px solid var(--glass-border); padding: 6px 8px; border-radius: 8px; }
        .switch-wrapper span { font-size: 0.7rem; font-weight: 700; }
        .switch { position: relative; display: inline-block; width: 30px; height: 18px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 12px; width: 12px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--primary); }
        input:checked + .slider:before { transform: translateX(12px); }

        /* Toasts */
        .toast-container { position: fixed; bottom: 15px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: 8px; z-index: 9999; }
        .toast { background: #2d3436; color: white; padding: 8px 16px; border-radius: 30px; font-size: 0.8rem; font-weight: 700; display: flex; align-items: center; gap: 8px; opacity: 1; transition: opacity 0.3s; }
    </style>
</head>
<body>

    <div class="toast-container" id="toastContainer"></div>

    <div class="app-container">
        
        <div class="top-controls">
            <button class="icon-btn" onclick="openModal()"><i class="fa-solid fa-sliders"></i></button>
            <button class="icon-btn" onclick="location.reload()"><i class="fa-solid fa-rotate-right"></i></button>
        </div>

        <!-- قسم البروفايل -->
        <div class="profile-wrapper">
            <img src="https://midomido.neocities.org/Imageme/file_00000000b0e471f4bb14b679b943d519.png" alt="MohaMmAD_WaSSouF Profile" class="profile-avatar">
            <h1 class="profile-name">MohaMmAD_WaSSouF</h1>
            <p class="profile-title">استوديو العزل الذكي</p>
        </div>

        <!-- منطقة الرفع -->
        <div class="drop-zone" id="dropZone" onclick="document.getElementById('audioFile').click()">
            <input type="file" id="audioFile" style="display: none;" accept="audio/*">
            <i class="fa-solid fa-cloud-arrow-up main-icon" id="dropIcon"></i>
            <h3 style="margin: 0; font-size: 0.95rem;" id="dropTitle">انقر لاختيار الأغنية</h3>
            <div class="file-details" id="fileDetails">
                <span class="badge"><i class="fa-solid fa-music"></i> <span id="lblFName">الملف</span></span>
                <span class="badge"><i class="fa-solid fa-weight-scale"></i> <span id="lblFSize">0MB</span></span>
            </div>
        </div>

        <!-- شريط التقدم -->
        <div class="progress-wrapper" id="progressWrapper">
            <div class="progress-header">
                <span id="progStatus">جاري التحليل...</span>
                <span id="progPercent" style="color: var(--primary);">0%</span>
            </div>
            <div class="progress-track">
                <div class="progress-bar" id="progBar"></div>
            </div>
        </div>

        <!-- النتائج -->
        <div class="results-container" id="resultsContainer">
            <div class="result-card vocal">
                <div class="card-header">
                    <h3><i class="fa-solid fa-microphone-lines"></i> المطرب</h3>
                </div>
                <div class="custom-player">
                    <button class="play-btn" onclick="togglePlay('vocalAudio', this)"><i class="fa-solid fa-play"></i></button>
                    <div class="timeline-wrapper">
                        <div class="time-display"><span id="vocalCurrent">0:00</span><span id="vocalTotal">0:00</span></div>
                        <input type="range" id="vocalSeek" value="0" max="100" oninput="seekAudio('vocalAudio', this.value)">
                    </div>
                </div>
                <audio id="vocalAudio" style="display: none;" ontimeupdate="updateProgress('vocalAudio', 'vocalSeek', 'vocalCurrent')" onloadedmetadata="setDuration('vocalAudio', 'vocalTotal')"></audio>
                <button class="btn-download-custom" onclick="downloadFile('vocalAudio', 'Vocals_Only.wav')"><i class="fa-solid fa-download"></i> حفظ الصوت</button>
            </div>

            <div class="result-card inst">
                <div class="card-header">
                    <h3><i class="fa-solid fa-music"></i> الموسيقى</h3>
                </div>
                <div class="custom-player">
                    <button class="play-btn" onclick="togglePlay('instAudio', this)"><i class="fa-solid fa-play"></i></button>
                    <div class="timeline-wrapper">
                        <div class="time-display"><span id="instCurrent">0:00</span><span id="instTotal">0:00</span></div>
                        <input type="range" id="instSeek" value="0" max="100" oninput="seekAudio('instAudio', this.value)">
                    </div>
                </div>
                <audio id="instAudio" style="display: none;" ontimeupdate="updateProgress('instAudio', 'instSeek', 'instCurrent')" onloadedmetadata="setDuration('instAudio', 'instTotal')"></audio>
                <button class="btn-download-custom" onclick="downloadFile('instAudio', 'Instrumental.wav')"><i class="fa-solid fa-download"></i> حفظ الموسيقى</button>
            </div>
        </div>

        <!-- زر المعالجة -->
        <button class="btn-process" id="processBtn" onclick="startProcessing()">
            <i class="fa-solid fa-wand-magic-sparkles"></i> عزل الصوت
        </button>
    </div>

    <!-- الإعدادات -->
    <div class="modal-overlay" id="settingsModal" onclick="closeModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div class="modal-header">
                <h2><i class="fa-solid fa-sliders"></i> إعدادات المحرك</h2>
                <button class="close-modal" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
            </div>
            
            <div class="form-group full-width">
                <label>دقة العزل (Window Size)</label>
                <select id="cfg_window">
                    <option value="320">عادي (سريع)</option>
                    <option value="512">متوازن (جيد جداً)</option>
                    <option value="1024" selected>فائق (أفضل جودة)</option>
                </select>
            </div>
            
            <div class="form-group full-width">
                <label>شراسة العزل (Aggression)</label>
                <div style="display: flex; gap: 10px; align-items: center;">
                    <input type="range" id="cfg_agg" min="1" max="10" value="5" style="flex:1;" oninput="document.getElementById('agg_val').innerText = this.value">
                    <span id="agg_val" style="font-weight: bold; width: 15px; font-size: 0.8rem;">5</span>
                </div>
            </div>

            <div class="switch-wrapper">
                <span>تصفية التشويش</span>
                <label class="switch"><input type="checkbox" id="cfg_post" checked><span class="slider"></span></label>
            </div>
            <div class="switch-wrapper">
                <span>معالجة الترددات</span>
                <label class="switch"><input type="checkbox" id="cfg_high" checked><span class="slider"></span></label>
            </div>
            <div class="switch-wrapper">
                <span>تحسين الذكاء</span>
                <label class="switch"><input type="checkbox" id="cfg_tta"><span class="slider"></span></label>
            </div>
            <div class="form-group">
                <label>مستوى الصوت</label>
                <input type="number" id="cfg_amp" value="0.1" step="0.1" min="0.0" max="1.0">
            </div>

            <div class="form-group full-width" style="margin-top: 5px;">
                <button class="btn-download-custom" style="background: var(--primary); color: white; border: none;" onclick="closeModal()">حفظ</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { Client } from "https://esm.sh/@gradio/client";

        let currentFile = null;
        let simInterval = null;

        window.showToast = function(msg, icon = 'fa-check') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.innerHTML = `<i class="fa-solid ${icon}"></i> <span>${msg}</span>`;
            container.appendChild(toast);
            setTimeout(() => { toast.style.opacity = '0'; setTimeout(() => toast.remove(), 300); }, 2500);
        }

        window.openModal = () => {
            const m = document.getElementById('settingsModal');
            m.style.display = 'flex';
            setTimeout(() => m.style.opacity = '1', 10);
        }
        window.closeModal = (e) => {
            if(e && e.target !== document.getElementById('settingsModal')) return;
            const m = document.getElementById('settingsModal');
            m.style.opacity = '0';
            setTimeout(() => m.style.display = 'none', 200);
        }

        document.getElementById('audioFile').addEventListener('change', (e) => {
            if(e.target.files.length > 0) {
                currentFile = e.target.files[0];
                document.getElementById('fileDetails').style.display = 'flex';
                document.getElementById('dropTitle').innerText = "تم التقاط الأغنية";
                document.getElementById('dropIcon').className = "fa-solid fa-check-circle main-icon";
                document.getElementById('dropIcon').style.color = "var(--success)";
                
                document.getElementById('lblFName').innerText = currentFile.name.substring(0, 15) + '...';
                document.getElementById('lblFSize').innerText = (currentFile.size / 1048576).toFixed(1) + 'MB';
            }
        });

        window.startProcessing = async function() {
            if(!currentFile) return showToast('اختر الأغنية أولاً', 'fa-triangle-exclamation');
            
            const btn = document.getElementById('processBtn');
            const wrap = document.getElementById('progressWrapper');
            const drop = document.getElementById('dropZone');
            const res = document.getElementById('resultsContainer');
            const progBar = document.getElementById('progBar');
            const progTxt = document.getElementById('progStatus');
            const progPerc = document.getElementById('progPercent');
            
            drop.style.display = 'none';
            res.style.display = 'none';
            wrap.style.display = 'flex';
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> المعالجة مستمرة...';

            let p = 0;
            simInterval = setInterval(() => {
                if(p < 30) { p+=1.5; progTxt.innerText = "جاري رفع البيانات..."; }
                else if(p < 85) { p+=0.2; progTxt.innerText = "العزل قيد التنفيذ..."; }
                progBar.style.width = p + '%';
                progPerc.innerText = Math.floor(p) + '%';
            }, 300);

            try {
                const wSize = parseInt(document.getElementById('cfg_window').value);
                const agg = parseInt(document.getElementById('cfg_agg').value);
                const isPost = document.getElementById('cfg_post').checked;
                const isHigh = document.getElementById('cfg_high').checked;
                const isTTA = document.getElementById('cfg_tta').checked;
                const amp = parseFloat(document.getElementById('cfg_amp').value);
                
                const client = await Client.connect("TheStinger/UVR5_UI");
                const result = await client.predict("/vrarch_separator", {
                    audio: currentFile,
                    model: "6_HP-Karaoke-UVR.pth",
                    out_format: "wav",
                    window_size: wSize,
                    aggression: agg,
                    tta: isTTA,
                    post_process: isPost,           
                    post_process_threshold: 0.1,
                    high_end_process: isHigh,
                    batch_size: 1,
                    norm_thresh: 0.1,
                    amp_thresh: amp,
                    single_stem: "(None)"
                });

                clearInterval(simInterval);
                progBar.style.width = '100%';
                progPerc.innerText = '100%';
                progTxt.innerText = "نجاح!";
                
                const getUrl = (i) => (typeof i==='string')?i:((i&&i.url)?i.url:((i&&i.path)?"https://thestinger-uvr5-ui.hf.space/file="+i.path:""));
                
                document.getElementById('instAudio').src = getUrl(result.data[0]);
                document.getElementById('vocalAudio').src = getUrl(result.data[1]);
                
                setTimeout(() => {
                    wrap.style.display = 'none';
                    res.style.display = 'flex'; 
                    btn.innerHTML = '<i class="fa-solid fa-rotate-left"></i> معالجة جديدة';
                    btn.onclick = () => location.reload();
                    btn.disabled = false;
                    showToast('تم الفصل بنجاح!');
                }, 800);

            } catch (err) {
                clearInterval(simInterval);
                showToast('خطأ! استخدم كاسر البروكسي', 'fa-xmark');
                setTimeout(() => location.reload(), 3000);
            }
        }

        // مشغل الصوت المخصص مع تضخيم الصوت (200%)
        window.audioContexts = window.audioContexts || {};
        
        window.togglePlay = function(audioId, btnEl) {
            const audio = document.getElementById(audioId);
            const icon = btnEl.querySelector('i');
            
            if (!window.audioContexts[audioId]) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                const ctx = new AudioContext();
                const source = ctx.createMediaElementSource(audio);
                const gainNode = ctx.createGain();
                
                gainNode.gain.value = 2.0; // 200% Volume
                
                source.connect(gainNode);
                gainNode.connect(ctx.destination);
                window.audioContexts[audioId] = { ctx, gainNode };
            }

            if(audio.paused) { 
                if(window.audioContexts[audioId].ctx.state === 'suspended') {
                    window.audioContexts[audioId].ctx.resume();
                }
                audio.play(); 
                icon.className = 'fa-solid fa-pause'; 
            } else { 
                audio.pause(); 
                icon.className = 'fa-solid fa-play'; 
            }
        }

        const fmtTime = (secs) => {
            const m = Math.floor(secs / 60) || 0;
            const s = Math.floor(secs % 60) || 0;
            return m + ':' + (s < 10 ? '0' : '') + s;
        }

        window.setDuration = (audioId, displayId) => {
            document.getElementById(displayId).innerText = fmtTime(document.getElementById(audioId).duration);
        }

        window.updateProgress = (audioId, seekId, currentId) => {
            const audio = document.getElementById(audioId);
            const slider = document.getElementById(seekId);
            if(audio.duration) {
                slider.value = (audio.currentTime / audio.duration) * 100;
                document.getElementById(currentId).innerText = fmtTime(audio.currentTime);
            }
        }

        window.seekAudio = (audioId, percent) => {
            const audio = document.getElementById(audioId);
            if(audio.duration) audio.currentTime = (percent / 100) * audio.duration;
        }

        window.downloadFile = (audioId, name) => {
            const url = document.getElementById(audioId).src;
            if(!url) return;
            const a = document.createElement('a');
            a.href = url; a.download = name;
            document.body.appendChild(a); a.click(); document.body.removeChild(a);
            showToast('جاري التنزيل...');
        }
    </script>
</body>
</html>
