<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مختبر الاستضافة الحقيقية</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: #0f172a; color: #fff; text-align: center; padding: 30px; }
        input { padding: 10px; background: #1e293b; color: #fff; margin-bottom: 20px; border-radius: 5px; width: 90%; }
        button { background: #00f0ff; color: #000; border: none; padding: 15px 30px; font-weight: bold; font-size: 16px; border-radius: 8px; cursor: pointer; transition: 0.2s; }
        button:hover { background: #00c4cc; }
        #log { margin-top: 20px; padding: 15px; background: #000; color: #00ff88; border: 1px solid #00ff88; border-radius: 8px; font-family: monospace; direction: ltr; min-height: 50px; white-space: pre-wrap; word-break: break-all; }
    </style>
</head>
<body>

    <h2 style="color:#00f0ff;">اختبار Catbox من الاستضافة 🚀</h2>
    <p style="font-size: 13px; color: #94a3b8;">تأكد من إطفاء إضافة الـ CORS نهائياً قبل التجربة!</p>

    <input type="file" id="myFile">
    <br>
    <button onclick="testCatbox()">جرب الرفع الآن</button>

    <div id="log">بانتظار التجربة...</div>

    <script>
        async function testCatbox() {
            const logEl = document.getElementById('log');
            const fileInput = document.getElementById('myFile');
            
            if (fileInput.files.length === 0) return logEl.innerHTML = "❌ الرجاء اختيار ملف أولاً.";
            
            const file = fileInput.files[0];
            logEl.innerHTML = `⏳ جاري إرسال الملف (${(file.size / 1024 / 1024).toFixed(2)} MB) إلى Catbox...`;

            const formData = new FormData();
            formData.append('reqtype', 'fileupload');
            formData.append('fileToUpload', file);

            try {
                const response = await fetch('https://catbox.moe/user/api.php', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) throw new Error(`كود الخطأ من السيرفر: ${response.status}`);

                const textUrl = await response.text();

                if (textUrl.startsWith('http')) {
                    logEl.innerHTML = `✅ نجح الرفع!\n\nالرابط المباشر:\n<a href="${textUrl}" target="_blank" style="color:#fde047">${textUrl}</a>`;
                } else {
                    logEl.innerHTML = `❌ السيرفر رد ولكن فشل الرفع:\n${textUrl}`;
                }
            } catch (error) {
                logEl.innerHTML = `❌ فشل الاتصال!\nالسبب: ${error.message}\n\n⚠️ تأكد أنك تفتح هذا الملف من رابط استضافة حقيقي وليس من Localhost.`;
            }
        }
    </script>
</body>
</html>
