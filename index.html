<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>مختبر الإشعارات - أبو فايز</title>
  <style>
     body { font-family: Tahoma; padding: 20px; background: #050b12; color: #fff; text-align: center;}
     input { width: 90%; padding: 12px; margin: 10px 0; background: #111; color: #00f0ff; border: 1px solid #00f0ff; border-radius: 8px;}
     button { padding: 15px; width: 90%; background: #ff0090; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: bold;}
     #log { background: #000; color: #00ff88; padding: 15px; min-height: 120px; margin-top: 20px; border-radius: 8px; font-family: monospace; white-space: pre-wrap; direction: ltr; text-align: left; border: 1px solid #333;}
  </style>
</head>
<body>
  <h2>🧪 مختبر Vercel للإشعارات</h2>
  <label>1. حط التوكن اللي طلعلك بالرسالة:</label>
  <input type="text" id="token" placeholder="الصق التوكن هون...">
  
  <label>2. رابط سيرفرك (لا تغيره):</label>
  <input type="text" id="vercel" value="https://neonchat-five.vercel.app/api/send" readonly>
  
  <button onclick="firePush()">🚀 إطلاق إشعار تجريبي</button>
  
  <div id="log">نتيجة السيرفر رح تطلع هون...</div>

  <script>
    async function firePush() {
      const token = document.getElementById('token').value.trim();
      const vercel = document.getElementById('vercel').value.trim();
      const log = document.getElementById('log');
      
      if(!token) { log.innerHTML = "❌ يرحم بيّك حط التوكن أول شي!"; log.style.color = "#ff0090"; return; }
      
      log.innerHTML = "⏳ عم نتصل بـ Vercel...";
      log.style.color = "#00f0ff";
      
      try {
        const res = await fetch(vercel, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            token: token,
            title: "من المختبر 🧪",
            body: "إذا شفت هي الرسالة، Vercel شغال 100%",
            icon: "icon-192.png"
          })
        });
        
        const data = await res.json();
        if(data.success) {
           log.innerHTML = "✅ السيرفر رد بنجاح:\n" + JSON.stringify(data, null, 2);
           log.style.color = "#00ff88";
        } else {
           log.innerHTML = "❌ السيرفر رفض:\n" + JSON.stringify(data, null, 2);
           log.style.color = "#ff0090";
        }
      } catch(e) {
        log.innerHTML = "❌ السيرفر ما رد (مشكلة بالرابط أو Vercel نايم):\n" + e.message;
        log.style.color = "#ff0090";
      }
    }
  </script>
</body>
</html>
